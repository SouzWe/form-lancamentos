<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lançamento</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --txt: var(--tg-theme-text-color, #1b1b1b);
    --dica: var(--tg-theme-hint-color, #7a7a7a);
    --campo: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --btn: var(--tg-theme-button-color, #2a7de1);
    --btn-txt: var(--tg-theme-button-text-color, #ffffff);
    --erro: #d64545;
    --ok: #2e9e5b;
    --vazio-alfa: .5;    /* 12/11 (Wellington): opacidade do texto de dentro dos campos — ajustar só este número (1 = sólido, 0 = invisível) */
    --vazio: rgba(169, 169, 169, var(--vazio-alfa));   /* cinza (darkgray) do exemplo e dos campos vazios */
    --fixo: #f59e0b;   /* 08/11: fixo de empresa (DDD + 8) — amarelo quase laranja, para não confundir com o vermelho */
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 96px; background: var(--bg); color: var(--txt);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dica); font-size: 14px; margin: 0 0 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .03em;
           color: var(--dica); margin-bottom: 8px; padding: 0; }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  label[for=c_hora_de], label[for=c_hora_ate] { font-size: 12px; white-space: nowrap; }   /* 08/11: "Melhor horário da visita" cabe na linha (-2) */
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: 10px;
         background: var(--campo); color: var(--txt); font: inherit; }
  /* 12/11 (Wellington): campo vazio (data "dd/mm/aaaa", escolha "—" / "— (sem horário)") no mesmo cinza do exemplo dos outros campos */
  ::placeholder { color: var(--vazio); opacity: 1; }
  input.vazio, select.vazio { color: var(--vazio); }
  select.vazio option { color: var(--txt); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--btn); }
  textarea { min-height: 64px; resize: vertical; }
  .linha { display: grid; gap: 8px; align-items: end; margin-bottom: 8px; }
  .linha.venda { grid-template-columns: 1fr 64px 92px 36px; }
  .linha.talao { grid-template-columns: 1fr 104px 36px; }
  .linha input, .linha select { padding: 10px; }
  .linha { position: relative; }
  .pp .achados { position: absolute; left: 0; right: 0; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .tirar { height: 42px; border: 0; border-radius: 10px; background: var(--campo); color: var(--erro); font-size: 20px; }
  .add { width: 100%; padding: 10px; border: 1px dashed var(--dica); border-radius: 10px; background: none;
         color: var(--btn); font: inherit; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .total { text-align: right; font-weight: 600; margin-top: 8px; }
  .total .sub { font-weight: 400; color: var(--dica); }   /* 12/11 (I032): Subtotal e Desconto */
  .desconto { margin-top: 8px; }
  .enviar { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px; border: 0; border-radius: 12px;
            background: var(--btn); color: var(--btn-txt); font: 600 17px/1 inherit; }
  .aviso { color: var(--erro); font-size: 14px; min-height: 20px; }
  /* 08/11 (Wellington): erro ao enviar aparece no TOPO da tela (acima do teclado), em faixa vermelha */
  .aviso:not(:empty) { position: fixed; left: 16px; right: 16px; top: 8px; z-index: 50; min-height: 0;
    background: var(--erro); color: #fff; font-weight: 600; padding: 12px 14px; border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  /* 08/11: celular com +55 fixo na frente (número completo para a automação) */
  .ddi { display: flex; gap: 6px; align-items: stretch; }
  .ddi span { display: flex; align-items: center; padding: 0 10px; border-radius: 10px; background: var(--campo);
    color: var(--dica); font-weight: 600; }
  .ddi input { flex: 1; min-width: 0; }
  .campo-ruim input { border: 1px solid var(--erro); }
  .cel-msg { color: var(--erro); font-size: 13px; margin-top: 6px; }
  .cel-msg:empty { display: none; }
  /* 08/11 (Wellington, teste): pergunta ao assistente no fim do formulário — botão próprio, não grava nada */
  .perguntar { width: 100%; margin-top: 8px; padding: 12px; border: 1px solid var(--btn); border-radius: 10px;
    background: none; color: var(--btn); font: 600 15px/1 inherit; }
  /* 08/11 (Wellington): rótulo do WhatsApp — vazio = "WhatsApp" verde transparente; certo = "WhatsApp" + borda verdes;
     sem DDD = só "(com DDD)" vermelho */
  .lb-wpp { color: rgba(46, 158, 91, .55); }
  .cel-certo .lb-wpp { color: var(--ok); }
  .cel-certo .ddi input { border: 1px solid var(--ok); }
  .sem-ddd .lb-ddd { color: var(--erro); }
  .cel-fixo .lb-wpp { color: var(--fixo); }
  .cel-ruim .lb-wpp, #bloco-cel.cel-falta .lb-wpp { color: var(--erro); }   /* vermelho = só "WhatsApp" + borda */   /* 08/11: número errado = "WhatsApp" vermelho, como as outras cores */
  .cel-fixo .ddi input { border: 1px solid var(--fixo); }
  #bloco-cel.cel-fixo .dica { color: var(--fixo); }
  /* 08/11 (Wellington): situação do cliente ao escolher o nome — deve = vermelho, não deve = verde */
  .situacao { font-size: 13px; margin-top: 16px; line-height: 1.5; }   /* 08/11: uma linha de espaço depois do celular */
  #cel_dica { display: none; }   /* 08/11 (Wellington): menos informação — a cor do rótulo/borda do WhatsApp já mostra o estado */
  .situacao .deve, .situacao .total { color: var(--dica); }     /* 08/11: texto cinza (cor das dicas)… */
  .situacao .deve b, .situacao .total b { color: var(--erro); }  /* …só o valor em vermelho (igual ao "Falta R$ X") */
  .situacao .total { text-align: left; margin-top: 2px; }
  .situacao .limpo { color: var(--ok); font-weight: 600; }
  /* 13/11 (C045/C116): 🗺️ Cobranças por região — só consulta. Layout v2 (13/11, Wellington) */
  .cb-busca { margin-bottom: 4px; }
  /* faixa da região: largura total, cinza claro, sem cantos; letra igual às legendas ("CADASTRO") */
  .cb-reg { display: flex; justify-content: space-between; gap: 12px; margin: 30px -16px 4px; padding: 9px 16px;
            background: var(--campo); border-radius: 0; font-weight: 600; font-size: 14px; text-transform: uppercase;
            letter-spacing: .03em; color: var(--dica); }
  .cb-reg b { white-space: nowrap; font-weight: 600; }
  /* cliente: mais espaço em cima/embaixo; linha contínua embaixo de TODOS (texto 50%) */
  .cb-item { padding: 16px 0 14px; border-bottom: 1px solid rgba(127, 127, 127, .5);
             border-bottom-color: color-mix(in srgb, var(--txt) 50%, transparent); }
  .cb-item:has(+ .cb-total) { border-bottom: 0; }   /* antes do total vale só a linha do total */
  .cb-nome { font-weight: 600; font-size: 15px; padding-right: 44px; }
  /* 13/11: 🗺️ rota no canto superior direito do bloco (acima do número); sem endereço nem CEP = apagado */
  .cb-item { position: relative; }
  .cb-rota { position: absolute; top: 10px; right: 0; border: 0; background: none; padding: 4px 6px;
             font-size: 22px; line-height: 1; cursor: pointer; }
  .cb-rota.off { opacity: .25; cursor: default; }
  /* 13/11: escolha do app da rota (folha de baixo); toque fora ou ✕ fecha; último app usado em destaque */
  .cb-fundo { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; }
  .cb-folha { width: 100%; background: var(--bg); color: var(--txt); border-radius: 16px 16px 0 0;
              padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(0, 0, 0, .3); }
  .cb-folha-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cb-folha-topo b { font-size: 15px; }
  .cb-folha-x { border: 0; background: none; color: var(--dica); font-size: 20px; padding: 4px 8px; cursor: pointer; }
  .cb-apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cb-apps button { padding: 12px 8px; border: 1px solid transparent; border-radius: 12px; background: var(--campo);
                    color: var(--txt); font: inherit; font-size: 14px; cursor: pointer; }
  .cb-apps button.ultimo { border-color: var(--btn); background: var(--btn); color: var(--btn-txt); font-weight: 600; }
  .cb-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; padding: 8px 16px;
              border-radius: 999px; background: rgba(0, 0, 0, .8); color: #fff; font-size: 14px; }
  .cb-li { font-size: 14px; margin-top: 3px; }
  .cb-li.atraso { color: var(--erro); }
  .cb-cel { text-align: right; margin-top: 10px; }   /* número no fim do bloco, à direita */
  .cb-total { border-top: 1px solid rgba(127, 127, 127, .85); border-top-color: color-mix(in srgb, var(--txt) 85%, transparent);
              margin-top: 14px; padding-top: 14px; font-weight: 600; }
  /* 13/11: o número é o botão (pílula) — mesmas cores do campo WhatsApp do formulário */
  .cb-num { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 3px 12px;
            background: transparent; font: inherit; font-size: 13px; line-height: 1.4; }
  button.cb-num { cursor: pointer; }
  .cb-num.ok { color: var(--ok); } .cb-num.fixo { color: var(--fixo); } .cb-num.erro { color: var(--erro); }
  .cb-vazio { color: var(--ok); font-weight: 600; margin-top: 18px; }
  .cb-nada { color: var(--dica); margin-top: 18px; }
  .situacao .rot { color: var(--dica); margin-top: 6px; }   /* 09/11: rótulo "Débitos em aberto:" / "Débito anterior:" */
  .sem-ddd .ddi input { border: 1px solid var(--erro); }
  /* 08/11: CEP — 8 números: certo = borda verde, errado = borda vermelha; vazio pode */
  .cep-ok input { border: 1px solid var(--ok); }
  .cep-ruim input { border: 1px solid var(--erro); }
  /* 13/11 (I034): endereço pelo CEP */
  .cep-usar { margin-top: 6px; padding: 6px 12px; border: 1px solid var(--ok); border-radius: 999px;
              background: none; color: var(--ok); font: inherit; font-size: 13px; cursor: pointer; }
  input.erro-campo, select.erro-campo, .add.erro-campo { border: 1px solid var(--erro) !important; }   /* 12/11: campo do erro ao enviar */
  pre { white-space: pre-wrap; background: var(--campo); padding: 12px; border-radius: 10px; font-size: 13px; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--campo); padding: 4px;
          border-radius: 12px; margin-bottom: 14px; }
  .abas button { border: 0; padding: 10px; border-radius: 9px; background: none; color: var(--txt); font: inherit; }
  .abas button.on { background: var(--btn); color: var(--btn-txt); }
  .achados { margin-top: 4px; border-radius: 10px; overflow-y: auto; max-height: 280px; }
  .achados button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0;
                    border-top: 1px solid var(--bg); background: var(--campo); color: var(--txt); font: inherit; }
  .achados small, .escolhido small { color: var(--dica); }
  .escolhido { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px;
               border-radius: 10px; background: var(--campo); border: 1px solid var(--btn); }
  .escolhido button { border: 0; background: none; color: var(--erro); font-size: 18px; }
  .oculto { display: none; }
  .dica { color: var(--dica); font-size: 13px; margin-top: 6px; }
  /* 07/11: "Falta" em caixa igual ao Total; valor vermelho (saldo devedor), quitada em verde */
  .dica.caixa { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
                border-radius: 10px; background: var(--campo); font-size: 14px; margin-top: 10px; }
  .dica.deve { color: var(--txt); }      /* 07/11: frase em branco (cor do texto do tema), teste */
  .dica.deve b { color: var(--erro); }   /* 07/11: frase simples (caixa recusada), só o valor em vermelho */
  .dica.quitada { border: 1px solid var(--ok); color: var(--ok); font-weight: 600; }
  .dica.excesso { color: var(--erro); }
  /* 13/11 (E2 🚚): Entrega — Eu entrego (padrão, sem frete) | 🚚 Entregador (frete da região). Sem frete = borda vermelha */
  .entrega { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--campo); padding: 4px;
             border-radius: 12px; border: 1px solid transparent; }
  .entrega label { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 10px;
                   border-radius: 9px; cursor: pointer; font-size: 15px; color: var(--txt); }
  .entrega input { width: auto; height: auto; margin: 0; padding: 0; accent-color: var(--btn); }
  .entrega label:has(input:checked) { background: var(--btn); color: var(--btn-txt); }
  .entrega.erro-frete, .entrega.erro-campo { border-color: var(--erro); }
  /* 14/11 (E3 + E4 🚚): Entregas (interno) — cartão por entrega + ações */
  .en-cad { margin-bottom: 6px; }
  .en-cad .add { margin-bottom: 4px; }
  .en-form { margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--campo); }
  .en-form input { background: var(--bg); }
  .en-form .ddi span { background: var(--bg); }
  .en-salvar { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: var(--btn);
               color: var(--btn-txt); font: 600 15px/1 inherit; cursor: pointer; }
  .en-ents { color: var(--dica); font-size: 13px; margin: 2px 0 6px; }
  .en-item { position: relative; padding: 16px 0 14px; border-bottom: 1px solid rgba(127, 127, 127, .5);
             border-bottom-color: color-mix(in srgb, var(--txt) 50%, transparent); }
  .en-ped { color: var(--dica); font-size: 12px; margin-top: 2px; }
  .en-st { font-size: 14px; margin-top: 3px; font-weight: 600; }
  .en-st.saiu { color: var(--fixo); }
  .en-pago { color: var(--ok); }
  .en-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .en-acoes button { padding: 10px 4px; border: 1px solid transparent; border-radius: 10px; background: var(--campo);
                     color: var(--txt); font: inherit; font-size: 13px; cursor: pointer; }
  .en-acoes button.zap { grid-column: 1 / -1; border-color: var(--ok); color: var(--ok); background: none; font-weight: 600; }
  /* 14/11 (2º teste): cards sempre abertos; cor pelo status (🕓 pendente = claro, 🛵 saiu = escuro); mais espaço entre cards */
  .en-cad { margin-top: 28px; }
  .en-item { margin: 14px -16px; padding: 16px; border-bottom: 0; }
  .en-item .cb-rota { right: 16px; }
  .en-item.pend { background: var(--campo); }
  .en-item.pend .en-acoes button:not(.zap) { background: var(--bg); }
  .en-item.saiu { border-top: 1px solid color-mix(in srgb, var(--txt) 25%, transparent);
                  border-bottom: 1px solid color-mix(in srgb, var(--txt) 25%, transparent); }
  .cb-cancelar { width: 100%; margin-top: 12px; padding: 12px; border: 1px solid var(--dica); border-radius: 12px;
                 background: none; color: var(--txt); font: inherit; font-size: 14px; cursor: pointer; }
  .en-form-bts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .en-form-bts .en-salvar, .en-form-bts .cb-cancelar { margin-top: 0; }
  .en-lista-ent { display: grid; gap: 8px; }
  .en-lista-ent button { padding: 12px; border: 0; border-radius: 12px; background: var(--campo); color: var(--txt);
                         font: inherit; text-align: left; cursor: pointer; }
  .en-lista-ent button.ultimo { background: var(--btn); color: var(--btn-txt); font-weight: 600; }
  /* 08/11 (Wellington): celular na Venda nova — verde = cadastrado, vermelho = atenção */
  #bloco-cel.cel-ok input { border: 1px solid var(--ok); }
  #bloco-cel.cel-ok .dica { color: var(--ok); }
  #bloco-cel.cel-falta input { border: 1px solid var(--erro); }
  #bloco-cel.cel-falta .dica { color: var(--erro); }
</style>
</head>
<body>
<h1 id="titulo"></h1>
<p class="sub">Preencha o que tiver. Campo em branco pode. Nada é gravado antes da sua confirmação no chat.</p>
<form id="form" autocomplete="off"></form>
<p class="aviso" id="aviso"></p>
<pre id="saida" hidden></pre>
<button class="enviar" id="enviar" type="button">Enviar</button>

<script>
const tg = window.Telegram && Telegram.WebApp;
const TIPOS = ["venda", "cliente", "divida", "cobrancas", "entregas"];   // 13/11: 🗺️ Cobranças (só consulta); 14/11: 🚚 Entregas
const tipo = TIPOS.includes(new URLSearchParams(location.search).get("tipo")) ? new URLSearchParams(location.search).get("tipo") : "venda";
const $ = s => document.querySelector(s);
const form = $("#form");

// Listas vêm no link do botão (depois do #, não chega a servidor nenhum): z = JSON compactado (deflate puro,
// base64 url-safe) com p = produtos [id, nome, unidade, preço], c = clientes [id, nome, bairro], r = bairros [nome].
// Sem listas, os campos ficam livres.
let PRODUTOS = [], CLIENTES = [], BAIRROS = [], FRETES = {};   // 13/11 (E1 🚚): f = {região: frete}
let ENTREGAS_LISTA = [], ENTREGADORES = [];   // 14/11 (E3 + E4 🚚): e = entregas abertas, g = entregadores ativos
async function carregarListas() {
  try {
    const b = (new URLSearchParams(location.hash.slice(1)).get("z") || "").replace(/-/g, "+").replace(/_/g, "/");
    if (!b) return;
    const bytes = Uint8Array.from(atob(b + "=".repeat((4 - b.length % 4) % 4)), c => c.charCodeAt(0));
    const fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const d = JSON.parse(await new Response(fluxo).text());
    PRODUTOS = d.p || []; CLIENTES = d.c || []; BAIRROS = d.r || []; FRETES = d.f || {};
    ENTREGAS_LISTA = d.e || []; ENTREGADORES = d.g || [];
  } catch (e) { /* sem listas: campos livres */ }
}

carregarListas().then(montar);
// ---------- regra do celular (08/11), compartilhada (13/11) ----------
// Celular = DDD + 9 + 8 dígitos (11); fixo de empresa (WhatsApp Business) = DDD + 8 dígitos (10). +55 aceito.
// O formulário (erroCel/digitosCel) e a 🗺️ Cobranças usam ESTAS duas funções.
const digitosNumero = v => { let d = String(v || "").replace(/\D/g, ""); if (d.length > 11 && d.startsWith("55")) d = d.slice(2); return d; };
function erroNumeroCel(v) {
  let d = String(v || "").replace(/\D/g, "");
  if (!d) return "";   // celular é opcional
  if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
  if (d.length === 8 || d.length === 9) return "Celular sem DDD: coloque o DDD antes, ex.: (00) 00000-0000.";
  if (d.length === 11 && d[2] !== "9") return "Celular com 11 números precisa ter o 9 depois do DDD, ex.: (00) 90000-0000.";
  if (d.length !== 10 && d.length !== 11) return "Número com quantidade errada: DDD + número (celular 11 dígitos, fixo 10).";
  return "";
}

// ---------- rota + cópia + link (13/11; globais desde 14/11: 🗺️ Cobranças e 🚚 Entregas usam os mesmos) ----------
const escHtml = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// abrirRota(x): x = { nome, end, reg ("" = sem região), cep (só números) }
function abrirLink(url) {
  if (tg && tg.openLink && tg.platform && tg.platform !== "unknown") tg.openLink(url); else window.open(url, "_blank");
}
// 🗺️ Rota (13/11): escolha do app — Waze, Google Maps (de onde o vendedor está: sem origem = GPS),
// copiar o endereço ou mandar no WhatsApp (sem número: o vendedor escolhe o contato). Nada é enviado sozinho.
const CHAVE_APP = "cb_rota_app";
const lerApp = () => { try { return localStorage.getItem(CHAVE_APP) || ""; } catch (e) { return ""; } };
const guardarApp = a => { try { localStorage.setItem(CHAVE_APP, a); } catch (e) {} };
function avisoCurto(txt) {
  const el = document.createElement("div");
  el.className = "cb-toast"; el.textContent = txt;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}
function copiarTexto(txt) {
  const reserva = () => {
    const a = document.createElement("textarea");
    a.value = txt; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    a.remove(); return ok;
  };
  const fim = ok => avisoCurto(ok ? "Endereço copiado" : "Não deu para copiar");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => fim(true), () => fim(reserva()));
  else fim(reserva());
}
function abrirRota(x, comCancelar) {   // 14/11: comCancelar = botão "✕ Cancelar" embaixo (🚚 Entregas)
  if (!x || (!x.end && !x.cep)) return;
  const cep = x.cep.length === 8 ? x.cep.slice(0, 5) + "-" + x.cep.slice(5) : x.cep;
  const destino = [x.end, x.reg, cep].filter(Boolean).join(", ");   // o mesmo de antes
  const d = encodeURIComponent(destino);
  const maps = `https://www.google.com/maps/dir/?api=1&destination=${d}`;
  const acoes = {
    waze: () => abrirLink(`https://waze.com/ul?q=${d}&navigate=yes`),
    maps: () => abrirLink(maps),
    copiar: () => copiarTexto(destino),
    // 13/11: copia o endereço DENTRO do toque (antes de abrir o WhatsApp); se a cópia falhar, abre igual
    whats: () => { try { copiarTexto(destino); } catch (e) {} abrirLink(`https://wa.me/?text=${encodeURIComponent(`📍 ${x.nome}\n${destino}\n${maps}`)}`); },
  };
  const ult = lerApp();
  const bt = (k, txt) => `<button type="button" data-app="${k}"${k === ult ? ' class="ultimo"' : ""}>${txt}</button>`;
  const fundo = document.createElement("div");
  fundo.className = "cb-fundo";
  fundo.innerHTML = `<div class="cb-folha" role="dialog" aria-label="Rota até ${escHtml(x.nome)}">
    <div class="cb-folha-topo"><b>🗺️ Rota até ${escHtml(x.nome)}</b><button type="button" class="cb-folha-x" aria-label="Fechar">✕</button></div>
    <div class="cb-apps">${bt("waze", "🚗 Waze")}${bt("maps", "📍 Google Maps")}${bt("copiar", "📋 Copiar endereço")}${bt("whats", "💬 Mandar no WhatsApp")}</div>${comCancelar ? '<button type="button" class="cb-cancelar">✕ Cancelar</button>' : ""}</div>`;
  const fechar = () => fundo.remove();
  fundo.onclick = e => { if (e.target === fundo) fechar(); };
  fundo.querySelector(".cb-folha-x").onclick = fechar;
  if (comCancelar) fundo.querySelector(".cb-cancelar").onclick = fechar;
  fundo.querySelectorAll("[data-app]").forEach(b => b.onclick = () => { guardarApp(b.dataset.app); fechar(); acoes[b.dataset.app](); });
  document.body.appendChild(fundo);
}

// ---------- 🗺️ Cobranças por região (13/11, C045 + C116/I033) ----------
// Só consulta: sem Enviar, não grava e não manda nada ao bot. Dados no link do botão:
// c = [id, nome, região, celular, talão, vendas em aberto, talão vencido "DD/MM/AAAA", cobrança do talão,
//      cobrança das vendas, horário dela, venda vencida (1/0), horário do talão]; r = regiões.
// 14/11: pílula do WhatsApp do cliente — a mesma na 🗺️ Cobranças e na 🚚 Entregas.
// Verde = celular (abre), laranja = fixo (abre), vermelho = errado, laranja "⚠️ ✖ sem número". attrs = data-* do botão.
function pilulaCel(v, attrs, rotulo) {
  const esc = escHtml, d = digitosNumero(v);
  const mostraNum = d => d.length < 3 ? d : `(${d.slice(0, 2)}) ` + (d.length - 2 > 4 ? d.slice(2, d.length - 2 >= 9 ? 7 : 6) + "-" + d.slice(d.length - 2 >= 9 ? 7 : 6) : d.slice(2));
  if (!d) return `<span class="cb-num fixo">⚠️ ✖ sem número</span>`;
  if (erroNumeroCel(v)) return `<span class="cb-num erro">⚠️ ${esc(mostraNum(d))}</span>`;
  const fixo = d.length === 10;
  const fmt = fixo ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  return `<button type="button" class="cb-num ${fixo ? "fixo" : "ok"}" ${attrs} aria-label="${esc(rotulo)}">${fixo ? "☎️" : "💬"} ${esc(fmt)} ›</button>`;
}

function montarCobrancas() {
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reais = n => "R$ " + n.toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+,)/g, ".");
  const sem = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const SEM_REG = "__sem";
  const dataISO = s => { const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s || "")); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
  const d0 = new Date(); d0.setMinutes(d0.getMinutes() - d0.getTimezoneOffset());
  const hoje = d0.toISOString().slice(0, 10);
  const ddmm = iso => iso.slice(8, 10) + "/" + iso.slice(5, 7);
  const cel = v => {
    let d = String(v || "").replace(/\D/g, "");
    if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
    return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`
      : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d;
  };
  // Data da cobrança = a mais próxima entre venda e talão; vencida tem prioridade (a mais antiga)
  const devedores = CLIENTES.map(c => {
    const talao = Number(c[4]) || 0, aberto = Number(c[5]) || 0, total = Math.round((talao + aberto) * 100) / 100;
    const ds = [];
    if (talao > 0) { const d = dataISO(c[6]) || dataISO(c[7]); if (d) ds.push({ d, h: c[11] || "", venc: !!c[6] || d < hoje }); }
    if (aberto > 0) { const d = dataISO(c[8]); if (d) ds.push({ d, h: c[9] || "", venc: c[10] === 1 || d < hoje }); }
    const venc = ds.filter(x => x.venc).sort((a, b) => a.d.localeCompare(b.d));
    const outras = ds.filter(x => !x.venc).sort((a, b) => a.d.localeCompare(b.d));
    const cob = venc[0] || outras[0] || null;
    return { id: c[0], nome: c[1], reg: c[2] || SEM_REG, cel: c[3], talao, aberto, total, cob, ordem: cob ? (cob.venc ? 0 : 1) : 2,
             end: String(c[12] || "").trim(), cep: String(c[13] || "").replace(/\D/g, "") };   // 13/11: 13º/14º = endereço, CEP
  }).filter(x => x.total > 0.004);   // só quem deve (talão + vendas em aberto)
  const regioes = [...BAIRROS];
  devedores.forEach(x => { if (x.reg !== SEM_REG && !regioes.includes(x.reg)) regioes.push(x.reg); });
  regioes.sort((a, b) => sem(a).localeCompare(sem(b)));
  const temSem = CLIENTES.some(c => !c[2]);
  // 13/11: o número vira o botão. Verde = celular (abre), laranja = fixo (abre), vermelho = errado, laranja "✖ sem número".
  const pilula = x => pilulaCel(x.cel, `data-id="${esc(x.id)}"`, "Cobrar no WhatsApp");   // 14/11: função global
  // v2: nome + código → 💸 total → data → 🛒 vendas em aberto → 📒 talão → número (à direita)
  const linha = x => {
    const cod = String(x.id).replace(/\D/g, "").slice(-4);
    const quando = !x.cob ? `<div class="cb-li">sem data de cobrança</div>`
      : x.cob.venc ? `<div class="cb-li atraso">⚠️ venceu ${ddmm(x.cob.d)}</div>`
      : `<div class="cb-li">📆 cobrança ${ddmm(x.cob.d)}${x.cob.h ? " " + esc(x.cob.h) : ""}</div>`;
    const rota = x.end || x.cep
      ? `<button type="button" class="cb-rota" data-rota="${esc(x.id)}" aria-label="Rota até o cliente">🗺️</button>`
      : `<span class="cb-rota off" aria-label="Sem endereço">🗺️</span>`;
    return `<div class="cb-item">${rota}<div class="cb-nome">${esc(x.nome)} ${esc(cod)}</div>`
      + `<div class="cb-li">💸 ${reais(x.total)}</div>` + quando
      + (x.aberto > 0 ? `<div class="cb-li">🛒 Débitos em aberto: ${reais(x.aberto)}</div>` : "")
      + (x.talao > 0 ? `<div class="cb-li">📒 Talão: ${reais(x.talao)}</div>` : "")
      + `<div class="cb-cel">${pilula(x)}</div></div>`;
  };
  const ordenar = l => l.sort((a, b) => a.ordem - b.ordem || (a.cob && b.cob ? a.cob.d.localeCompare(b.cob.d) : 0) || sem(a.nome).localeCompare(sem(b.nome)));
  const soma = l => Math.round(l.reduce((s, x) => s + x.total, 0) * 100) / 100;
  const bloco = (reg, l) => `<div class="cb-reg"><span>📍 ${esc(reg === SEM_REG ? "Sem região" : reg)}</span><b>${reais(soma(l))}</b></div>` + ordenar(l).map(linha).join("");
  // 📲 Cobrar (13/11): abre o WhatsApp do vendedor na conversa do cliente com a mensagem pronta; NÃO envia sozinho.
  // I035 (futuro): trocar SÓ esta função para pedir o envio ao agente do WhatsApp.
  function cobrarWhatsApp(x) {
    let d = String(x.cel || "").replace(/\D/g, "");
    if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
    if (!d) return;
    const nome = String(x.nome).trim().split(/\s+/)[0];
    const fim = " Qualquer dúvida, estou à disposição. 😊";
    const msg = !x.cob ? `Olá, ${nome}! Passando para lembrar do valor em aberto de ${reais(x.total)}.${fim}`
      : x.cob.venc ? `Olá, ${nome}! Passando para lembrar da cobrança de ${reais(x.total)}, que venceu em ${ddmm(x.cob.d)}.${fim}`
      : `Olá, ${nome}! Passando para lembrar da cobrança de ${reais(x.total)}, combinada para ${ddmm(x.cob.d)}.${fim}`;
    abrirLink(`https://wa.me/55${d}?text=${encodeURIComponent(msg)}`);
  }
  function mostrar() {
    const esc_ = $("#cb_regiao").value, el = $("#cb_lista"), q = sem($("#cb_busca").value.trim());
    setTimeout(() => {
      el.querySelectorAll("button.cb-num[data-id]").forEach(b => b.onclick = () => cobrarWhatsApp(devedores.find(x => x.id === b.dataset.id)));
      el.querySelectorAll("button.cb-rota[data-rota]").forEach(b => b.onclick = () => {
        const x = devedores.find(x => x.id === b.dataset.rota);
        abrirRota(x && { ...x, reg: x.reg === SEM_REG ? "" : x.reg });
      });
    }, 0);
    const vale = x => (!esc_ || x.reg === esc_) && (!q || sem(x.nome).includes(q));   // v2: busca vale junto com a região
    const lista = devedores.filter(vale);
    if (!lista.length) {
      el.innerHTML = q ? `<div class="cb-nada">Nenhum cliente encontrado.</div>` : `<div class="cb-vazio">✅ Ninguém devendo nesta região.</div>`;
      return;
    }
    if (esc_) { el.innerHTML = bloco(esc_, lista) + `<div class="cb-total">Total da região: ${reais(soma(lista))}</div>`; return; }
    const grupos = [...regioes, SEM_REG].map(r => [r, lista.filter(x => x.reg === r)]).filter(([, l]) => l.length);   // região sem resultado some
    el.innerHTML = grupos.map(([r, l]) => bloco(r, l)).join("") + `<div class="cb-total">Total geral: ${reais(soma(lista))}</div>`;
  }
  $("#titulo").textContent = "🗺️ Cobranças";
  document.querySelector(".sub").textContent = "Só consulta: não grava nada e não manda nada ao bot.";
  $("#enviar").remove();
  form.innerHTML = `<div class="cb-busca"><input id="cb_busca" type="search" placeholder="🔍 Buscar cliente pelo nome…" autocomplete="off"></div>`
    + `<label for="cb_regiao">Região</label><select id="cb_regiao"><option value="">Todas as regiões</option>`
    + regioes.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("")
    + (temSem ? `<option value="${SEM_REG}">Sem região</option>` : "") + `</select><div id="cb_lista"></div>`;
  $("#cb_regiao").onchange = mostrar;
  $("#cb_busca").oninput = mostrar;
  mostrar();
  if (tg) { tg.ready(); tg.expand(); }
}

// ---------- 🚚 Entregas (14/11, E3 + E4) — interno: vendedor / ponto fixo ----------
// O motoboy só usa o WhatsApp: recebe 1 mensagem pronta (💬), toca no link e responde "saí"/"entreguei".
// Dados no link do botão: e = [pedido, cliente, nome, celular, região, endereço, referência, CEP, a cobrar,
// saiu (0/1), hora da saída, entregador]; g = [id, nome, celular]. Entregue some da lista (o vigia reenvia os botões).
// 🛵 Saiu / ✅ Entregue / ↩️ mandam uma linha curta ao bot, que grava direto (sem prévia).
function montarEntregas() {
  const esc = escHtml;
  const reais = n => "R$ " + Number(n).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+,)/g, ".");
  const fmtCel = v => { const d = digitosNumero(v);
    return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d; };
  const cepFmt = c => c.length === 8 ? c.slice(0, 5) + "-" + c.slice(5) : c;
  const nomeEnt = id => (ENTREGADORES.find(g => g[0] === id) || [])[1] || id;
  // quem o vendedor escolheu no 💬 (por pedido, só neste aparelho) vale para o 🛵 Saiu
  const CHAVE = "cb_ent_";
  const lerEsc = p => { try { return localStorage.getItem(CHAVE + p) || ""; } catch (e) { return ""; } };
  const guardarEsc = (p, id) => { try { localStorage.setItem(CHAVE + p, id); localStorage.setItem(CHAVE + "ultimo", id); } catch (e) {} };
  const lista = ENTREGAS_LISTA.map(e => ({ ped: e[0], cli: e[1], nome: e[2], cel: e[3], reg: e[4] || "", end: e[5] || "",
    ref: e[6] || "", cep: String(e[7] || ""), cobrar: Number(e[8]) || 0, saiu: e[9] === 1, saida: e[10] || "", ent: e[11] || "" }));
  const entDe = x => x.ent || (ENTREGADORES.some(g => g[0] === lerEsc(x.ped)) ? lerEsc(x.ped) : "");
  const destino = x => [x.end, x.reg, cepFmt(x.cep)].filter(Boolean).join(", ");
  const temEnd = x => !!(x.end || x.cep);
  function mensagem(x) {
    return [`🚚 Entrega · ${x.nome}`,
      `📍 ${[x.end, x.reg, x.cep ? "CEP " + cepFmt(x.cep) : ""].filter(Boolean).join(", ") || "endereço não cadastrado"}`,
      ...(x.ref ? [`📌 Ref.: ${x.ref}`] : []),
      ...(digitosNumero(x.cel) ? [`📞 Cliente: ${fmtCel(x.cel)}`] : []),
      x.cobrar > 0 ? `💰 Cobrar: ${reais(x.cobrar)}` : "💰 Já pago (não cobrar)",
      ...(temEnd(x) ? [`🗺️ Rota: https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino(x))}`] : []),
      `Responda "saí" ao sair e "entreguei" ao entregar 👍`].join("\n");
  }
  function aviso(txt) {
    const a = $("#aviso"); a.textContent = txt;
    if (txt) { a.style.top = ((window.visualViewport ? visualViewport.offsetTop : 0) + 8) + "px"; setTimeout(() => { a.textContent = ""; }, 6000); }
  }
  function enviarBot(texto) {
    if (tg && tg.platform && tg.platform !== "unknown") { tg.sendData(texto); return; }   // fecha a janela e manda ao bot
    $("#saida").hidden = false; $("#saida").textContent = texto;                           // fora do Telegram: só mostra
  }
  // folha de baixo com os entregadores (mesmo visual da escolha do app da rota).
  // 14/11: ✕ no topo, "✕ Cancelar" embaixo e toque fora fecham sem fazer nada; opts.atual = entregador já escolhido
  // (aparece marcado) e opts.limpar = mostra "Tirar a escolha".
  function escolherEntregador(titulo, depois, opts = {}) {
    if (!ENTREGADORES.length) { aviso("Nenhum entregador cadastrado: use + Entregador (no fim da página)."); abrirCadastro(); return; }
    let ult = opts.atual || ""; if (!ult) { try { ult = localStorage.getItem(CHAVE + "ultimo") || ""; } catch (e) {} }
    const fundo = document.createElement("div");
    fundo.className = "cb-fundo";
    fundo.innerHTML = `<div class="cb-folha" role="dialog" aria-label="${esc(titulo)}">
      <div class="cb-folha-topo"><b>${esc(titulo)}</b><button type="button" class="cb-folha-x" aria-label="Fechar">✕</button></div>
      <div class="en-lista-ent">${ENTREGADORES.map(g => `<button type="button" data-ent="${esc(g[0])}"${g[0] === ult ? ' class="ultimo"' : ""}>🛵 ${esc(g[1])} <small>${esc(fmtCel(g[2]))}</small>${g[0] === opts.atual ? " ✓" : ""}</button>`).join("")}</div>
      ${opts.limpar ? '<button type="button" class="cb-cancelar" data-limpar="1">Remover entregador</button>' : ""}
      <button type="button" class="cb-cancelar" data-cancelar="1">✕ Cancelar</button></div>`;
    const fechar = () => fundo.remove();
    fundo.onclick = e => { if (e.target === fundo) fechar(); };
    fundo.querySelector(".cb-folha-x").onclick = fechar;
    fundo.querySelector("[data-cancelar]").onclick = fechar;
    if (opts.limpar) fundo.querySelector("[data-limpar]").onclick = () => { fechar(); opts.limpar(); };
    fundo.querySelectorAll("[data-ent]").forEach(b => b.onclick = () => { fechar(); depois(ENTREGADORES.find(g => g[0] === b.dataset.ent)); });
    document.body.appendChild(fundo);
  }
  const esquecerEsc = p => { try { localStorage.removeItem(CHAVE + p); } catch (e) {} };
  // 💬 Enviar ao entregador: abre o WhatsApp NO NÚMERO DELE com a mensagem pronta e copia o endereço (não envia sozinho)
  function mandarAoEntregador(x) {
    escolherEntregador(`💬 Enviar a entrega de ${x.nome} para…`, g => {
      guardarEsc(x.ped, g[0]);
      if (temEnd(x)) { try { copiarTexto(destino(x)); } catch (e) {} }
      abrirLink(`https://wa.me/55${digitosNumero(g[2])}?text=${encodeURIComponent(mensagem(x))}`);
      mostrar();
    }, { atual: entDe(x),
         // 14/11 (2º teste): trocar = abrir o 💬 e escolher outro; "Remover entregador" só com escolha feita e antes do 🛵 Saiu
         // (a escolha é só deste aparelho; nada vai ao bot)
         limpar: !x.saiu && !x.ent && entDe(x) ? () => { esquecerEsc(x.ped); mostrar(); } : null });
  }
  // 💬 do cliente (14/11): abre a conversa com ele, sem texto pronto
  function abrirCliente(x) {
    const d = digitosNumero(x.cel);
    if (d) abrirLink(`https://wa.me/55${d}`);
  }
  function status(x, st) {
    const ent = entDe(x);
    if (st === "saiu" && !ent) {
      escolherEntregador(`🛵 Quem saiu com a entrega de ${x.nome}?`, g => { guardarEsc(x.ped, g[0]); enviarBot(`🚚 ENTREGA ${x.ped}: saiu · ${g[0]}`); });
      return;
    }
    enviarBot(st === "pendente" ? `🚚 ENTREGA ${x.ped}: pendente` : `🚚 ENTREGA ${x.ped}: ${st}${ent ? " · " + ent : ""}`);
  }
  // 14/11 (2º teste): card sempre aberto, sem seleção. Claro = 🕓 pendente; escuro = 🛵 saiu.
  // Ordem: nome+código (🗺️ no canto) → pedido → 📍 → 💰 → status · 🚚 entregador → 💬 → 🛵/✅ → WhatsApp do cliente (à direita)
  const cartao = x => {
    const cod = String(x.cli).replace(/\D/g, "").slice(-4), ent = entDe(x), p = esc(x.ped);
    const rota = temEnd(x) ? `<button type="button" class="cb-rota" data-rota="${p}" aria-label="Rota até o cliente">🗺️</button>`
      : `<span class="cb-rota off" aria-label="Sem endereço">🗺️</span>`;
    const st = x.saiu ? `🛵 saiu ${esc(x.saida)}` : "🕓 pendente";
    return `<div class="en-item ${x.saiu ? "saiu" : "pend"}">${rota}`
      + `<div class="cb-nome">${esc(x.nome)} ${esc(cod)}</div>`
      + `<div class="en-ped">${p}</div>`
      + `<div class="cb-li">📍 ${esc([x.reg || "sem região", x.end].filter(Boolean).join(" · "))}</div>`
      + (x.cobrar > 0 ? `<div class="cb-li">💰 Cobrar: <b>${reais(x.cobrar)}</b></div>` : `<div class="cb-li en-pago">✅ Já pago</div>`)
      + `<div class="en-st${x.saiu ? " saiu" : ""}">${st}${ent ? ` · 🚚 Entregador ${esc(nomeEnt(ent))}` : ""}</div>`
      + `<div class="en-acoes"><button type="button" class="zap" data-a="zap" data-p="${p}">💬 Enviar ao entregador</button>`
      + (x.saiu ? `<button type="button" data-a="pendente" data-p="${p}">↩️ Pendente</button>`
                : `<button type="button" data-a="saiu" data-p="${p}">🛵 Saiu</button>`)
      + `<button type="button" data-a="entregue" data-p="${p}">✅ Entregue</button></div>`
      + `<div class="cb-cel">${pilulaCel(x.cel, `data-cli="${p}"`, "Abrir a conversa com o cliente no WhatsApp")}</div>`
      + `</div>`;
  };
  function mostrar() {
    const el = $("#en_lista");
    el.innerHTML = lista.length ? lista.map(cartao).join("") : `<div class="cb-vazio">✅ Nenhuma entrega pendente.</div>`;
    const achar = p => lista.find(x => x.ped === p);
    const rota = x => abrirRota({ nome: x.nome, end: x.end, reg: x.reg, cep: x.cep }, true);
    el.querySelectorAll("button.cb-rota[data-rota]").forEach(b => b.onclick = () => rota(achar(b.dataset.rota)));
    el.querySelectorAll("button.cb-num[data-cli]").forEach(b => b.onclick = () => abrirCliente(achar(b.dataset.cli)));
    el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      const x = achar(b.dataset.p), a = b.dataset.a;
      if (a === "zap") mandarAoEntregador(x); else status(x, a);
    });
  }

function montar() {
const OUTRO = "__outro";

const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const br = iso => iso ? iso.split("-").reverse().join("/") : "";
const reais = n => "R$ " + n.toFixed(2).replace(".", ",");
const num = v => { const n = parseFloat(String(v || "").replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const val = id => ($("#" + id)?.value || "").trim();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sem = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
if (tipo === "cobrancas") { montarCobrancas(); return; }   // 13/11: página só de consulta
if (tipo === "entregas") { montarEntregas(); return; }     // 14/11 (E4 🚚): interno

const CAMPO = (id, rotulo, tipoInput = "text", extra = "") =>
  `<label for="${id}">${rotulo}</label><input id="${id}" type="${tipoInput}" ${extra}>`;
// Celular/WhatsApp (08/11): +55 fixo na frente; digita só DDD + número. Fixo de empresa (DDD + 8) também vale.
const CAMPO_CEL = (id, msg = true) => `<div class="campo-cel" id="${id}_campo">
  <label for="${id}">Celular / <span class="lb-wpp">WhatsApp</span> (<span class="lb-ddd">com DDD</span>)</label>

  ${msg ? `<div class="cel-msg" id="${id}_msg"></div>` : ""}</div>`;

// Horários de 30 em 30 min, 08:00–20:00 (05/11): lista, sem digitar símbolo.
const HORAS = [];
for (let m = 8 * 60; m <= 20 * 60; m += 30) HORAS.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
const LISTA_HORA = (id, rotulo, vazio = "— (sem horário)") =>
  `<label for="${id}">${rotulo}</label><select id="${id}"><option value="">${vazio}</option>${HORAS.map(h => `<option>${h}</option>`).join("")}</select>`;
const HORA_COBRANCA = LISTA_HORA("cobranca_hora", "Horário da cobrança");
const linhaHoraCobranca = () => val("cobranca_hora") ? [`Horário de cobrança: ${val("cobranca_hora")}`] : [];

// ---------- lista acima do teclado (07/11, Wellington) ----------
// Ao tocar no campo: a tela rola até o campo ficar no topo e a lista encolhe para caber
// entre o campo e o teclado (rola dentro dela). Vale para cliente e produto.
const alturaVisivel = () => Math.min(window.visualViewport ? visualViewport.height : innerHeight, innerHeight);
function encaixar(input, lista) {
  if (!matchMedia("(pointer: coarse)").matches) return;   // só no celular (no PC não há teclado na tela)
  const ajustar = () => {
    if (!input.isConnected || !lista.innerHTML) return;
    const livre = alturaVisivel() - input.getBoundingClientRect().bottom - 12;
    lista.style.maxHeight = Math.max(120, livre) + "px";
  };
  const subir = () => {
    document.body.style.paddingBottom = "70vh";   // espaço para o campo conseguir subir até o topo
    const y = input.getBoundingClientRect().top + scrollY - 12;
    window.scrollTo({ top: y, behavior: "smooth" });
    [150, 400, 800].forEach(ms => setTimeout(ajustar, ms));   // espera o teclado abrir
  };
  input.addEventListener("focus", subir);
  input.addEventListener("input", ajustar);
  input.addEventListener("blur", () => setTimeout(() => {
    const a = document.activeElement;
    if (!a || !a.matches || !a.matches("#busca, [data-k=busca], " + CAMPO_DIGITAR)) document.body.style.paddingBottom = "";
  }, 200));
  if (window.visualViewport) visualViewport.addEventListener("resize", ajustar);
}

// ---------- todo campo de digitar sobe acima do teclado (08/11, Wellington) ----------
// Endereço, CEP, celular, obs etc.: ao tocar, a tela rola e o campo fica no topo (com o título dele visível).
// Cliente/produto já sobem pelo encaixar(). Data, hora e listas de escolha abrem seletor próprio → não mexe.
const CAMPO_DIGITAR = 'input:not([type=date]):not([type=time]):not([type=checkbox]):not([type=radio]), textarea';
if (matchMedia("(pointer: coarse)").matches) {
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (!el.matches || !el.matches(CAMPO_DIGITAR) || el.matches("#busca, [data-k=busca]")) return;
    document.body.style.paddingBottom = "70vh";
    const subir = () => {
      if (document.activeElement !== el) return;
      const y = el.getBoundingClientRect().top + scrollY - 40;   // 40px = título do campo aparece
      window.scrollTo({ top: y, behavior: "smooth" });
    };
    [50, 350].forEach(ms => setTimeout(subir, ms));   // de novo depois do teclado abrir
  });
  document.addEventListener("focusout", () => setTimeout(() => {
    const a = document.activeElement;
    if (!a || !a.matches || !a.matches(CAMPO_DIGITAR)) document.body.style.paddingBottom = "";
  }, 200));
}

// ---------- cliente já cadastrado: busca por nome ----------
let clienteEscolhido = null;
const BUSCA_CLIENTE = `<div id="caixa-cliente">
  <input id="busca" placeholder="${CLIENTES.length ? "Cliente… (toque ou digite)" : "Nome do cliente"}"><div class="achados" id="achados"></div></div>`;

    achados.innerHTML = lista

const nomeCliente = () => clienteEscolhido ? `${clienteEscolhido[1]} (${clienteEscolhido[0]})` : val("busca");

// ---------- cadastro de cliente novo ----------
const opsBairro = BAIRROS.map(b => `<option>${esc(b)}</option>`).join("");

// ---------- produtos ----------
function campoProduto() {
  if (!PRODUTOS.length) return `<input placeholder="Produto" data-k="nome">`;

const rotuloProduto = p => p[1] + (p[2] ? ` (${p[2]})` : "");

function ligarProduto(div) {
  const pp = div.querySelector(".pp");
  if (!pp) return;
  const busca = pp.querySelector("[data-k=busca]"), sel = pp.querySelector("[data-k=sel]");

  const mostrar = () => {
    const t = sem(busca.value.trim());
    const itens = PRODUTOS.map((p, i) => [p, i]).filter(([p]) => !t || sem(p[1]).includes(t))

    lista.querySelectorAll("[data-i]").forEach(b => b.onclick = () => escolher(b.dataset.i));

  busca.onfocus = busca.onclick = mostrar;
  encaixar(busca, lista);
  busca.oninput = () => { sel.value = ""; mostrar(); somar(); };
  document.addEventListener("click", e => { if (!pp.contains(e.target)) fechar(); });

const comQtd = () => tipo !== "divida";

function produtos() {
  return [...document.querySelectorAll("#produtos .linha")].map(l => {
    const g = k => (l.querySelector(`[data-k=${k}]`)?.value || "").trim();
    // Digitou e não tocou na lista: aceita se o texto bate com 1 produto só (06/11).
    let p = PRODUTOS[g("sel")];
    const t = sem(g("busca"));
    if (!p && t) {
      const ach = PRODUTOS.filter(x => sem(x[1]) === t || sem(rotuloProduto(x)) === t);
      const parc = ach.length ? ach : PRODUTOS.filter(x => sem(x[1]).includes(t));
      if (parc.length === 1) p = parc[0];
    }
    const novo = !p && g("nome") && (PRODUTOS.length || l.querySelector("[data-novo]"));
    return { nome: p ? `${p[1]} (${p[0]})` : g("nome") + (novo ? " (produto novo)" : ""), qtd: g("qtd") || (p && comQtd() ? "1" : ""), preco: g("preco"), valor: g("valor"),
             tabela: p ? Number(p[3]) : 0, busca: p ? "" : g("busca"), el: l };
  }).filter(p => p.nome || p.busca || p.qtd || p.preco || p.valor);
}

const subtotalVenda = () => produtos().reduce((s, p) => s + (comQtd() ? num(p.qtd || 1) * num(p.preco) : num(p.valor)), 0)
  + (tipo === "divida" ? num(val("ant_valor")) : 0);   // 08/11: no talão, o total soma o débito anterior
// 12/11 (I032): desconto % só no total (vazio/0 = sem desconto; 0,01 a 99,99). Os produtos ficam com o preço cheio.
// "7,5" e "7.5" valem 7,5% (o num() tira o ponto de milhar, aqui não serve).
const descPct = () => { const n = parseFloat(String(val("desc_pct") || "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const descOk = () => { const p = descPct(); return !val("desc_pct") || p === 0 || (p >= 0.01 && p <= 99.99); };
const descValor = () => { const p = descPct(); return descOk() && p > 0 ? Math.round(subtotalVenda() * p + 1e-7) / 100 : 0; };
const pctTxt = () => String(descPct()).replace(".", ",") + "%";
// 13/11 (E2 🚚): Entrega. Eu entrego = sem frete (venda igual a antes). 🚚 Entregador = frete fixo da região
// (link do botão, f = {região: frete}), somado DEPOIS do desconto (o desconto vale só nos produtos).
// Região sem frete (ou cliente sem região, ou bairro novo do "Outros") = borda vermelha + frase, não envia.
const comEntregador = () => !!document.querySelector("input[name=entrega][value=entregador]:checked");
function regiaoEntrega() {
  if (tipo === "venda") return clienteEscolhido ? String(clienteEscolhido[2] || "").trim() : "";
  if (tipo === "cliente") { const s = val("c_bairro"); return s === OUTRO ? val("c_bairro_novo") : s; }
  return "";
}
function freteDaRegiao(reg) {
  if (!reg) return 0;
  const k = Object.keys(FRETES).find(x => sem(x).trim() === sem(reg).trim());
  return k ? Number(FRETES[k]) || 0 : 0;
}
const freteValor = () => comEntregador() ? freteDaRegiao(regiaoEntrega()) : 0;
const FRETE_ERRO = "Região sem frete definido: escolha Eu entrego ou defina o frete da região.";
const freteErro = () => comEntregador() && !(freteValor() > 0) ? FRETE_ERRO : "";
const freteRot = () => `Frete (${regiaoEntrega()}): ${reais(freteValor())}`;
function mostrarFrete() {
  const d = $("#frete_dica");
  if (!d) return;
  const e = freteErro(), fv = freteValor();
  $("#entrega_box").classList.toggle("erro-frete", !!e);
  d.className = "dica" + (e ? " excesso" : "") + (e || fv ? "" : " oculto");
  d.textContent = e || (fv ? freteRot() : "");
}
const totalVenda = () => Math.round((subtotalVenda() - descValor() + freteValor()) * 100) / 100;   // total COM desconto e frete (pago, restante, frases)
function somar() {
  const s = subtotalVenda(), dv = descValor(), fv = freteValor(), t = totalVenda();
  const rot = tipo === "divida" ? "Total do talão: " : "Total: ";
  // ordem: Subtotal → Desconto → Frete (região) → Total
  $("#total").innerHTML = s <= 0 ? "" : !dv && !fv ? esc(rot + reais(t))   // 07/11: caixa testada e recusada, voltou o texto simples
    : `<div class="sub">Subtotal: ${reais(s)}</div>`
      + (dv ? `<div class="sub">Desconto: ${esc(pctTxt())} (− ${reais(dv)})</div>` : "")
      + (fv ? `<div class="sub">${esc(freteRot())}</div>` : "")
      + `<div>${esc(rot + reais(t))}</div>`;
  mostrarFrete();
  pagamento();
}

// Venda nova (07/11, Wellington): sem valor pago = cobrança agendada → data obrigatória (horário opcional).
// Pagou tudo → some a cobrança. Pagou parte → data do restante obrigatória.
function pagamento() {
  if (!$("#pg_valor")) return;
  const t = Math.round(totalVenda() * 100) / 100, pg = num(val("pg_valor"));
  if (tipo === "cliente") $("#bloco-compra").classList.toggle("oculto", !temCompra());   // 08/11: sem produto = só cadastro
  const quitou = pg > 0 && t > 0 && pg >= t - 0.005;
  if (tipo === "divida")   // 11/11: a frase mora na COBRANÇA → quitado esconde só data/horário, não o bloco
    [...$("#fs-cobranca").children].forEach(el => { if (el.tagName !== "LEGEND" && el.id !== "pg_dica") el.classList.toggle("oculto", quitou); });
  else $("#fs-cobranca").classList.toggle("oculto", quitou);
  // 12/11 (Wellington): no Débitos o rótulo é sempre curto (cabe na mesma linha do horário)
  $("label[for=cobranca]").textContent = pg > 0 && !quitou && tipo !== "divida" ? "Data de cobrança do restante *" : "Data de cobrança *";
  const d = $("#pg_dica"), excesso = pg > t + 0.005;
  d.className = "dica" + (!pg ? "" : excesso ? " excesso" : quitou ? " caixa quitada" : " deve");
  const tal = tipo === "divida";
  d.innerHTML = !pg ? (tal ? "Não recebeu nada? Deixe em branco e marque a data da cobrança." : "Não pagou agora? Deixe em branco e marque a data da cobrança.")
    : excesso ? (tal ? "Recebido maior que o total do talão." : "Pago maior que o total da venda.")
    : quitou ? `<span>✅ ${tal ? "Talão quitado" : "Venda quitada"}</span><span>sem cobrança</span>`
    : `Falta <b>${reais(t - pg)}</b> marque a data da cobrança do restante.`;
}

// Preço diferente da tabela = desconto/combinado: o texto avisa para o bot não trocar pelo de tabela.
const linhasVenda = () => produtos().map(p => {

    : p.tabela && Math.abs(preco - p.tabela) > 0.004 ? ` (preço combinado; tabela ${reais(p.tabela)})` : "";
  return `${p.qtd || "?"}x ${p.nome || "?"}${p.preco ? " " + reais(preco) : ""}${extra}`;
});

// Cliente novo: só conta como compra se tiver produto escolhido (linha vazia = só cadastro)
const temCompra = () => produtos().some(p => p.nome || p.busca);
// Pagamento + cobrança: mesmos da Venda nova (07/11) e da primeira compra do Cliente novo (08/11)

// 12/11 (Wellington): Débitos › Já cadastrado = cliente que AINDA NÃO TEM talão.

}
// 12/11 (Wellington): no Débitos a COBRANÇA é própria (data | horário lado a lado, frase embaixo) — ver template acima
$("#add").onclick = linhaProduto;
if ($("#pg_valor")) $("#pg_valor").oninput = pagamento;

}
// 08/11 (Wellington): voltou atrás — as 4 datas ficam sempre à mostra (a do recebimento continua vindo em branco)

// 12/11 (Wellington): data/horário/escolha sem valor ficam cinza (classe "vazio"); com valor, cor normal
function marcarVazios() {
  document.querySelectorAll('input[type=date], input[type=time], select').forEach(el => el.classList.toggle("vazio", !el.value));
}
document.addEventListener("input", marcarVazios); document.addEventListener("change", marcarVazios);
new MutationObserver(marcarVazios).observe(document.body, { childList: true, subtree: true });
marcarVazios();

// ---------- texto enviado ao bot ----------
// 12/11 (I032): só com desconto; sem desconto o texto fica igual a antes
// 13/11 (E2 🚚): com 🚚 Entregador entra "Frete (Região): R$ X" depois do Desconto (Subtotal → Desconto → Frete → Total)
const linhasDesconto = () => [
  ...(descValor() || freteValor() ? [`Subtotal: ${reais(subtotalVenda())}`] : []),
  ...(descValor() ? [`Desconto: ${pctTxt()} (− ${reais(descValor())})`] : []),
  ...(freteValor() ? [freteRot()] : [])];
function montarTexto() {
  // Total + pago na hora + cobrança: iguais na Venda nova e na 1ª compra do Cliente novo (08/11)
  const fechamento = () => {
    const t = totalVenda(), pg = num(val("pg_valor"));
    const quitou = pg > 0 && pg >= t - 0.005;
    const pago = pg > 0 ? [`Pago na hora: ${reais(pg)} (${val("pg_forma")})`] : ["Pago na hora: não"];
    const cob = quitou ? ["Cobrança: não tem (venda quitada)"]
      : [`${pg > 0 ? `Restante ${reais(t - pg)} · data` : "Data"} de cobrança: ${br(val("cobranca"))}`, ...linhaHoraCobranca()];
    // 13/11 (E2 🚚): Eu entrego = nenhuma linha nova; 🚚 Entregador = "Entrega: 🚚 Entregador" + linha do Frete
    return [...(comEntregador() ? ["Entrega: 🚚 Entregador"] : []), ...linhasDesconto(), `Total: ${reais(t)}`, "", ...pago, ...cob];
  };
  if (tipo === "venda") {
    return ["🛒 FORMULÁRIO VENDA NOVA", "", `Cliente: ${nomeCliente()}`, ...(clienteEscolhido ? [linhaCel()] : []), `Data da venda: ${br(val("data"))}`,
      "Produtos (quantidade e preço):", ...linhasVenda(), ...fechamento(), ...obsLinha()].join("\n");
  }
  if (tipo === "cliente") {
    return ["👤 FORMULÁRIO CLIENTE NOVO", "", ...linhasCadastro(), ...obsLinha(),
      ...(temCompra() ? ["", `Data da venda: ${br(val("data"))}`, "Primeira compra (quantidade e preço):", ...linhasVenda(), ...fechamento()] : [])].join("\n");
  }
  const linhas = produtos().map(p => `${p.nome || "?"}: ${p.valor ? reais(num(p.valor)) : "R$"}`);
  const ant = val("ant_valor") ? reais(num(val("ant_valor"))) : "R$";
  const t = totalVenda(), pg = num(val("pg_valor")), quitou = pg > 0 && pg >= t - 0.005;
  const cli = modoCliente === "novo" ? ["CLIENTE NOVO (cadastrar antes)", ...linhasCadastro()]
    : [`Cliente: ${nomeCliente()}`, ...(clienteEscolhido ? [linhaCel()] : [])];
  return ["📒 FORMULÁRIO DÉBITOS ANTERIORES", "", ...cli, "", "COBRANÇA", "",
    `Data de saida: ${br(val("ant_data")) || "//"}`, "Produtos:", ...linhas, "",   // 12/11: data única = Data débito anterior
    `Débito anterior: ${ant} data: ${br(val("ant_data")) || "//"}`, "",
    ...linhasDesconto(), `Total do talão: ${reais(t)}`,
    pg > 0 ? `Recebido: ${reais(pg)} (${val("pg_forma")}) em ${br(val("rec_data"))}` : "Recebido: não",
    ...(quitou ? ["Cobrança: não tem (talão quitado)"]
      : [`${pg > 0 ? `Restante ${reais(t - pg)} · data` : "Data"} de cobrança: ${br(val("cobranca"))}`, ...linhaHoraCobranca()]),
    ...obsLinha()].join("\n");
}

// Celular (08/11): trava no formulário, igual à regra do motor (DDD + número = 10 ou 11 dígitos; +55 aceito)
// Celular = DDD + 9 + 8 dígitos (11); fixo de empresa (WhatsApp Business) = DDD + 8 dígitos (10). +55 aceito.
function erroCel(id) { return erroNumeroCel(val(id)); }   // 13/11: a regra mora em erroNumeroCel (global)
let CEL_ERRO = "";
function celularRuim(id = "c_cel") { CEL_ERRO = erroCel(id); return !!CEL_ERRO; }
// Ao sair do campo: vermelho + mensagem se estiver errado; certo = arruma a máscara (00) 00000-0000
const ehSemDDD = e => e.startsWith("Celular sem DDD");
function pintarCel(id, saindo) {
  const inp = $("#" + id), campo = $("#" + id + "_campo"), caixa = $("#" + id + "_caixa"), msg = $("#" + id + "_msg");
  if (!inp) return;
  const e = erroCel(id);
  campo.classList.toggle("cel-certo", !!inp.value && !e && !ehFixo(id));
  campo.classList.toggle("cel-fixo", !!inp.value && !e && ehFixo(id));
  if (saindo) {
    if (!e && inp.value) inp.value = formatarCel(inp.value);
    campo.classList.toggle("sem-ddd", ehSemDDD(e));                 // sem DDD: só "(com DDD)" em vermelho
    caixa.classList.toggle("campo-ruim", !!e && !ehSemDDD(e));      // outro erro: "WhatsApp" + borda vermelhos
    campo.classList.toggle("cel-ruim", !!e && !ehSemDDD(e));
    if (msg) msg.textContent = "";                                   // 08/11: sem frase (o motivo aparece no topo ao enviar)
  } else if (!e) {                                                  // corrigindo: tira o vermelho assim que ficar certo
    campo.classList.remove("sem-ddd", "cel-ruim"); caixa.classList.remove("campo-ruim"); if (msg) msg.textContent = "";
  } else if (digitosCel(inp.value).length > 11) {                  // 08/11: número a mais já fica vermelho ao digitar
    caixa.classList.add("campo-ruim"); campo.classList.add("cel-ruim"); if (msg) msg.textContent = "";
  }
}
function ligarCel(id) {
  const inp = $("#" + id);
  if (!inp) return;
  inp.addEventListener("blur", () => { pintarCel(id, true); if (id === "v_cel") estadoCel(); });
  inp.addEventListener("input", () => pintarCel(id, false));
}

const digitosCel = digitosNumero;   // 13/11: mesma regra da 🗺️ Cobranças
function formatarCel(v) {
  const d = digitosCel(v);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return String(v || "");
}
// Venda nova (08/11): verde = celular do cadastro; vermelho = sem celular ou sem DDD; número diferente = atualiza o cadastro
const celCadastro = () => clienteEscolhido ? digitosCel(clienteEscolhido[3]) : "";
const celMudou = () => !!val("v_cel") && digitosCel(val("v_cel")) !== celCadastro();
function estadoCel() {
  const b = $("#bloco-cel"), d = $("#cel_dica");
  if (!b) return;
  const vazio = !val("v_cel"), ruim = !vazio && celularRuim("v_cel");
  const semDDD = ruim && ehSemDDD(CEL_ERRO);   // 08/11: sem DDD = só o "(com DDD)" do rótulo em vermelho
  const fixo = !vazio && !ruim && ehFixo("v_cel");
  b.className = fixo ? "cel-fixo" : semDDD ? "" : vazio || ruim ? "cel-falta" : "cel-ok";
  $("#v_cel_campo").classList.toggle("sem-ddd", semDDD);
  $("#v_cel_caixa").classList.toggle("campo-ruim", ruim && !semDDD);
  d.textContent = vazio ? "⚠️ Cliente sem celular cadastrado: peça o número."
    : semDDD ? ""
    : ruim ? CEL_ERRO
    : celMudou() ? (celCadastro() ? "✏️ Número novo: vai atualizar o cadastro." : "✏️ Número novo: vai entrar no cadastro.")
    : fixo ? "☎️ Número fixo: o bot vai confirmar se é de empresa com WhatsApp."
    : "✅ Celular cadastrado.";
}

// CEP (08/11): 8 números. Vazio pode seguir. Ao sair do campo: certo = verde e máscara 00000-000; errado = vermelho.
const cepRuim = () => { const d = val("c_cep").replace(/\D/g, ""); return !!d && d.length !== 8; };
function pintarCep(saindo) {
  const inp = $("#c_cep"), campo = $("#c_cep_campo");
  if (!inp) return;
  const d = inp.value.replace(/\D/g, ""), ok = d.length === 8;
  if (saindo && ok) inp.value = d.slice(0, 5) + "-" + d.slice(5);
  campo.classList.toggle("cep-ok", ok);
  if (saindo || ok || !d) campo.classList.toggle("cep-ruim", !!d && !ok);
}
function ligarCep() {
  const inp = $("#c_cep");
  if (!inp) return;
  inp.addEventListener("blur", () => pintarCep(true));
  inp.addEventListener("input", () => { pintarCep(false); buscarCep(); });
}
// I034 (13/11): CEP com 8 números → consulta o ViaCEP (só o CEP sai do celular). Preenche "Rua, " no Endereço
// com o cursor no fim (falta o número), dica com bairro/cidade e sugere a região se bater com a lista.
// Não acha / sem internet: aviso discreto, não trava o envio. Endereço já digitado: pergunta antes de trocar.
// O texto enviado ao bot não muda (Endereço, CEP, Bairro continuam vindo dos campos).
let cepConsultado = "";
function regiaoDoCep(bairro) {
  const n = sem(bairro).trim();
  if (!n || !BAIRROS.length) return "";
  const exato = BAIRROS.find(r => sem(r).trim() === n);
  if (exato) return exato;
  const perto = BAIRROS.filter(r => { const m = sem(r).trim(); return m && (m.includes(n) || n.includes(m)); });
  return perto.length === 1 ? perto[0] : "";   // nunca cria região: sem certeza, o vendedor escolhe
}
function mostrarDica(id, html) { const el = $("#" + id); if (!el) return; el.innerHTML = html; el.classList.toggle("oculto", !html); if ($("#frete_dica")) somar(); }
function buscarCep() {
  const d = val("c_cep").replace(/\D/g, "");
  if (d.length !== 8) { cepConsultado = ""; mostrarDica("c_cep_dica", ""); mostrarDica("c_end_dica", ""); return; }
  if (d === cepConsultado) return;
  cepConsultado = d;
  mostrarDica("c_cep_dica", "");
  const naoAchou = () => { if (cepConsultado === d) mostrarDica("c_cep_dica", "CEP não encontrado, preencha à mão."); };
  const ctl = window.AbortController ? new AbortController() : null;
  const tempo = setTimeout(() => ctl && ctl.abort(), 6000);
  fetch(`https://viacep.com.br/ws/${d}/json/`, ctl ? { signal: ctl.signal } : {})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(c => {
      clearTimeout(tempo);
      if (cepConsultado !== d) return;           // o vendedor já trocou o CEP
      if (!c || c.erro) return naoAchou();
      const cidade = [c.localidade, c.uf].filter(Boolean).join("/");
      const dica = esc([c.bairro, cidade].filter(Boolean).join(" · ")) + " (pelo CEP)";
      // 13/11 (ajuste): Bairro sempre preenchido. Bate com a lista = seleciona; não bate = "Outros (escrever)"
      // com o bairro do CEP (a prévia mostra "(novo)"). Bairro já escolhido pelo vendedor = só com a pergunta.
      const reg = regiaoDoCep(c.bairro);
      const sel = $("#c_bairro"), novo = $("#c_bairro_novo");
      const semLista = !sel || sel.classList.contains("oculto");   // sem regiões: só o campo de escrever
      const bairroLivre = semLista ? !val("c_bairro_novo") : (!sel.value || (sel.value === OUTRO && !val("c_bairro_novo")));
      const bairroIgual = !c.bairro || (reg ? sel && sel.value === reg
        : sem(val("c_bairro_novo")) === sem(c.bairro) && (semLista || sel.value === OUTRO));
      const usarBairro = () => {
        if (!c.bairro) return;
        if (reg && !semLista) { sel.value = reg; novo.classList.add("oculto"); return; }
        if (!semLista) sel.value = OUTRO;
        novo.value = c.bairro; novo.classList.remove("oculto");
      };
      if (!c.logradouro) { if (bairroLivre) usarBairro(); mostrarDica("c_end_dica", dica); return; }   // CEP geral: só a dica (como antes)
      const rua = c.logradouro + ", ", end = $("#c_end");
      const usarEnd = () => {
        end.value = rua; end.focus();
        try { end.setSelectionRange(rua.length, rua.length); } catch (e) {}
      };
      const endLivre = !val("c_end");
      if (bairroLivre) usarBairro();
      if (endLivre) usarEnd();
      const conflito = (!endLivre && val("c_end") !== rua.trim() && val("c_end") !== rua) || (!bairroLivre && !bairroIgual);
      if (!conflito) { mostrarDica("c_end_dica", dica); return; }
      // a mesma pergunta vale para os dois campos (Endereço e Bairro)
      const oque = [!endLivre && esc(c.logradouro), !bairroLivre && !bairroIgual && esc(reg || c.bairro)].filter(Boolean).join(" · ");
      mostrarDica("c_end_dica", `${dica}<br><button type="button" class="cep-usar" id="cep_usar">Usar endereço do CEP? ${oque}</button>`);
      $("#cep_usar").onclick = () => { usarBairro(); usarEnd(); mostrarDica("c_end_dica", dica); };
    })
    .catch(() => { clearTimeout(tempo); naoAchou(); });
}

// 08/11 (Wellington): só fica verde com celular completo (DDD + 9 números). Fixo (DDD + 8) passa sem trava,
// "WhatsApp" continua verde transparente e o bot pergunta se é mesmo fixo de empresa com WhatsApp.
const ehFixo = id => digitosCel(val(id)).length === 10;
const marcaFixo = id => ehFixo(id) ? " (fixo — confirmar)" : "";

// Situação do cliente ao escolher o nome (08/11, ideia do Wellington). Vem no link dos botões:
// c[4] = saldo do talão (débito anterior), c[5] = débitos em aberto (vendas a prazo não pagas),
// c[6] = "DD/MM/AAAA" se a cobrança do talão venceu, c[7] (09/11) = data de cobrança do talão ("" = sem data).
// 09/11 (Wellington) — padrão do "quanto deve": 💸 saldo devedor total SEMPRE no topo quando houver qualquer dívida
// → Débitos em aberto (🛒) → Débito anterior (📒 talão). Linha zerada some. Nunca "Vendas em aberto".
// Os botões voltam depois de cada gravação, então o valor sai atualizado.
function mostrarSituacao(c) {
  const el = $("#situacao");
  if (!el) return;
  if (c.length < 6) { el.innerHTML = ""; return; }   // botões antigos, sem saldo
  const talao = Number(c[4]) || 0, aberto = Number(c[5]) || 0;
  if (talao <= 0 && aberto <= 0) { el.innerHTML = `<div class="limpo">Não deve nada ✅</div>`; return; }
  const dm = d => esc(String(d).slice(0, 5));   // DD/MM/AAAA → DD/MM
  const dataTalao = c[6] ? ` · ⚠️ vencida desde ${dm(c[6])}`
    : c.length < 8 ? ""                                        // botões de antes de 09/11: sem a data
    : c[7] ? ` · cobrança ${dm(c[7])}` : " · não tem data de cobrança";
  el.innerHTML = `<div class="total">💸 Saldo devedor total: <b>${reais(talao + aberto)}</b></div>`
    + (aberto > 0 ? `<div class="rot">Débitos em aberto:</div><div class="deve">🛒 <b>${reais(aberto)}</b></div>` : "")
    + (talao > 0 ? `<div class="rot">Débito anterior:</div><div class="deve">📒 (talão): <b>${reais(talao)}</b>${dataTalao}</div>` : "");
}

function conferirPagamento() {
  if (!descOk()) return "Desconto precisa ser de 0,01% a 99,99% (ou deixe em branco).";
  if (freteErro()) return FRETE_ERRO;   // 13/11 (E2 🚚): 🚚 só com frete definido na região
  const t = totalVenda(), pg = num(val("pg_valor"));
  if (val("pg_valor") && pg <= 0) return "Valor pago inválido.";
  if (pg > t + 0.005) return tipo === "divida" ? "Recebido maior que o total do talão." : "Pago maior que o total da venda.";
  if (tipo === "divida" && pg > 0 && !val("rec_data")) return "Falta a data do recebimento.";
  if (pg > 0 && !val("pg_forma")) return "Escolha a forma do pagamento.";
  if (!pg && val("pg_forma")) return "Coloque o valor pago (ou tire a forma).";
  if (!(pg > 0 && pg >= t - 0.005) && !val("cobranca"))
    return pg > 0 ? "Falta a data da cobrança do restante."
      : tipo === "divida" ? "Sem recebimento: falta a data da cobrança." : "Sem pagamento agora: falta a data da cobrança.";
  return "";
}

function conferir() {
  const ps = produtos();
  if (tipo === "venda") {
    if (!nomeCliente()) return "Escolha o cliente.";
    if (celularRuim("v_cel")) return CEL_ERRO;
    if (ps.some(p => !p.nome && p.busca)) return "Toque no produto na lista (ou em ✏️ Outro).";
    if (!ps.some(p => p.nome)) return "Coloque pelo menos um produto.";
    return conferirPagamento();
  } else if (tipo === "cliente") {
    if (!val("c_nome")) return "Falta o nome do cliente.";
    if (celularRuim()) return CEL_ERRO;
    if (cepRuim()) return "CEP precisa ter 8 números (ex.: 08010-000).";
    if (temCompra()) {   // 08/11: 1ª compra com as mesmas travas da Venda nova
      if (ps.some(p => !p.nome && p.busca)) return "Toque no produto na lista (ou em ✏️ Outro).";
      if (!val("data")) return "Falta a data da venda.";
      return conferirPagamento();
    }
  } else {
    if (modoCliente === "novo" ? !val("c_nome") : !nomeCliente()) return "Falta o cliente.";
    if (modoCliente === "novo" ? celularRuim() : celularRuim("v_cel")) return CEL_ERRO;
    if (modoCliente === "novo" && cepRuim()) return "CEP precisa ter 8 números (ex.: 08010-000).";
    if (ps.some(p => !p.nome && p.busca)) return "Toque no produto na lista (ou em ✏️ Outro).";
    if (!(ps.some(p => num(p.valor) > 0) || num(val("ant_valor")) > 0)) return "Coloque algum valor (produto ou débito anterior).";
    return conferirPagamento();   // 08/11: Recebeu + Forma, data do restante — igual à Venda nova
  }
  return "";
}

// 12/11 (Wellington): ao enviar com erro, o campo do erro ganha borda vermelha, a tela rola até ele e põe o foco.
// As frases e as travas não mudam: aqui só se acha o campo de cada frase. Celular/CEP já pintam sozinhos (só rola).
const campoProd = l => l && (l.querySelector("[data-k=busca], [data-k=nome]"));
function camposDoErro(e) {
  if (!e) return { marcar: [], ir: null };
  const um = id => $("#" + id) ? [$("#" + id)] : [];
  const cli = () => (tipo === "cliente" || (tipo === "divida" && modoCliente === "novo")) ? um("c_nome") : um("busca");
  const linhas = [...document.querySelectorAll("#produtos .linha")];
  let m = [];
  if (/^(Escolha o cliente|Falta o cliente|Falta o nome do cliente)/.test(e)) m = cli();
  else if (e === CEL_ERRO && CEL_ERRO) {
    const id = tipo === "venda" || (tipo === "divida" && modoCliente !== "novo") ? "v_cel" : "c_cel";
    return { marcar: [], ir: $("#" + id) };
  }
  else if (e.startsWith("CEP precisa")) return { marcar: [], ir: $("#c_cep") };
  else if (e.startsWith("Toque no produto")) { const p = produtos().find(p => !p.nome && p.busca); m = p ? [campoProd(p.el)] : []; }
  else if (e.startsWith("Coloque pelo menos um produto")) {
    const l = linhas.find(l => !produtos().some(p => p.el === l && p.nome)) || linhas[0];
    m = l ? [campoProd(l)] : um("add");
  }
  else if (e.startsWith("Coloque algum valor")) m = [...um("ant_valor"), linhas[0] && linhas[0].querySelector("[data-k=valor]")];
  else if (e.startsWith("Falta a data da venda")) m = um("data");
  else if (e.startsWith("Escolha a forma")) m = um("pg_forma");
  else if (/^(Coloque o valor pago|Valor pago inválido|Pago maior|Recebido maior)/.test(e)) m = um("pg_valor");
  else if (e.startsWith("Falta a data do recebimento")) m = um("rec_data");
  else if (/falta a data da cobrança|Falta a data da cobrança/.test(e)) m = um("cobranca");
  else if (e.startsWith("Desconto precisa")) m = um("desc_pct");
  else if (e === FRETE_ERRO) m = um("entrega_box");   // 13/11 (E2 🚚)
  m = m.filter(Boolean);
  return { marcar: m, ir: m[0] || null };
}
function marcarErro(e) {
  document.querySelectorAll(".erro-campo").forEach(x => x.classList.remove("erro-campo"));
  const { marcar, ir } = camposDoErro(e);
  marcar.forEach(x => x.classList.add("erro-campo"));
  if (!ir) return;
  ir.scrollIntoView({ behavior: "smooth", block: "center" });
  try { ir.focus({ preventScroll: true }); } catch (_) { ir.focus(); }
}
// Corrigiu → a borda some (confere de novo; se o erro daquele campo saiu, tira a borda)
function rever() {
  const marcados = [...document.querySelectorAll(".erro-campo")];
  if (!marcados.length) return;
  const agora = camposDoErro(conferir()).marcar;
  marcados.forEach(x => { if (!agora.includes(x)) x.classList.remove("erro-campo"); });
}
["input", "change", "click"].forEach(ev => document.addEventListener(ev, () => setTimeout(rever, 0)));

// 08/11: o aviso de erro fica no topo da parte visível da tela (acima do teclado, se estiver aberto) e some ao corrigir
let avisoTimer;
function mostrarAviso(t) {
  const a = $("#aviso");
  a.textContent = t;
  if (!t) return;
  a.style.top = ((window.visualViewport ? visualViewport.offsetTop : 0) + 8) + "px";
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => { a.textContent = ""; }, 6000);
}
document.addEventListener("input", () => { if ($("#aviso").textContent) $("#aviso").textContent = ""; });

function entregar(texto) {
  // Aberto pelo botão do teclado o initData vem vazio; dentro do Telegram a plataforma não é "unknown".
  if (tg && tg.platform && tg.platform !== "unknown") { tg.sendData(texto); return; }   // fecha a janela e manda ao bot
  $("#saida").hidden = false; $("#saida").textContent = texto;  // fora do Telegram: só mostra
}
$("#enviar").onclick = () => {
  const nadaLancado = !produtos().some(p => p.nome || p.busca) && !val("ant_valor") && !val("pg_valor");
  if ($("#pergunta") && val("pergunta") && nadaLancado) { perguntar(); return; }
  const erro = conferir();
  mostrarAviso(erro);
  marcarErro(erro);   // 12/11: borda vermelha + rola até o campo
  if (erro) return;
  entregar(montarTexto());
};
// 08/11 (Wellington): basta o cliente escolhido (os dados dele já aparecem); sem cliente, bloqueia.
function perguntar() {
  if (!clienteEscolhido) { mostrarAviso("Escolha o cliente para perguntar."); return; }
  const p = val("pergunta");
  if (!p) { mostrarAviso("Escreva a pergunta."); return; }
  entregar(["💬 PERGUNTA AO ASSISTENTE", "", `Cliente: ${clienteEscolhido[1]} (${clienteEscolhido[0]})`, `Pergunta: ${p}`].join("\n"));
}
if ($("#perguntar")) $("#perguntar").onclick = perguntar;

if (tg) { tg.ready(); tg.expand(); }
}
</script>
