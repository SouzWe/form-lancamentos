<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lançamento</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --txt: var(--tg-theme-text-color, #1b1b1b);
    --dica: var(--tg-theme-hint-color, #7a7a7a);
    --campo: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --btn: var(--tg-theme-button-color, #2a7de1);
    --btn-txt: var(--tg-theme-button-text-color, #ffffff);
    --erro: #d64545;
    --ok: #2e9e5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 96px; background: var(--bg); color: var(--txt);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dica); font-size: 14px; margin: 0 0 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .03em;
           color: var(--dica); margin-bottom: 8px; padding: 0; }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: 10px;
         background: var(--campo); color: var(--txt); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--btn); }
  textarea { min-height: 64px; resize: vertical; }
  .linha { display: grid; gap: 8px; align-items: end; margin-bottom: 8px; }
  .linha.venda { grid-template-columns: 1fr 64px 92px 36px; }
  .linha.talao { grid-template-columns: 1fr 104px 36px; }
  .linha input, .linha select { padding: 10px; }
  .linha { position: relative; }
  .pp .achados { position: absolute; left: 0; right: 0; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .tirar { height: 42px; border: 0; border-radius: 10px; background: var(--campo); color: var(--erro); font-size: 20px; }
  .add { width: 100%; padding: 10px; border: 1px dashed var(--dica); border-radius: 10px; background: none;
         color: var(--btn); font: inherit; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .total { text-align: right; font-weight: 600; margin-top: 8px; }
  .enviar { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px; border: 0; border-radius: 12px;
            background: var(--btn); color: var(--btn-txt); font: 600 17px/1 inherit; }
  .aviso { color: var(--erro); font-size: 14px; min-height: 20px; }
  pre { white-space: pre-wrap; background: var(--campo); padding: 12px; border-radius: 10px; font-size: 13px; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--campo); padding: 4px;
          border-radius: 12px; margin-bottom: 14px; }
  .abas button { border: 0; padding: 10px; border-radius: 9px; background: none; color: var(--txt); font: inherit; }
  .abas button.on { background: var(--btn); color: var(--btn-txt); }
  .achados { margin-top: 4px; border-radius: 10px; overflow-y: auto; max-height: 280px; }
  .achados button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0;
                    border-top: 1px solid var(--bg); background: var(--campo); color: var(--txt); font: inherit; }
  .achados small, .escolhido small { color: var(--dica); }
  .escolhido { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px;
               border-radius: 10px; background: var(--campo); border: 1px solid var(--btn); }
  .escolhido button { border: 0; background: none; color: var(--erro); font-size: 18px; }
  .oculto { display: none; }
  .dica { color: var(--dica); font-size: 13px; margin-top: 6px; }
  /* 07/11: "Falta" em caixa igual ao Total; valor vermelho (saldo devedor), quitada em verde */
  .dica.caixa { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
                border-radius: 10px; background: var(--campo); font-size: 14px; margin-top: 10px; }
  .dica.deve b { color: var(--erro); }   /* 07/11: frase simples (caixa recusada), só o valor em vermelho */
  .dica.quitada { border: 1px solid var(--ok); color: var(--ok); font-weight: 600; }
  .dica.excesso { color: var(--erro); }
</style>
</head>
<body>
<h1 id="titulo"></h1>
<p class="sub">Preencha o que tiver. Campo em branco pode. Nada é gravado antes da sua confirmação no chat.</p>
<form id="form" autocomplete="off"></form>
<p class="aviso" id="aviso"></p>
<pre id="saida" hidden></pre>
<button class="enviar" id="enviar" type="button">Enviar</button>

<script>
const tg = window.Telegram && Telegram.WebApp;
const TIPOS = ["venda", "cliente", "divida"];
const tipo = TIPOS.includes(new URLSearchParams(location.search).get("tipo")) ? new URLSearchParams(location.search).get("tipo") : "venda";
const $ = s => document.querySelector(s);
const form = $("#form");

// Listas vêm no link do botão (depois do #, não chega a servidor nenhum): z = JSON compactado (deflate puro,
// base64 url-safe) com p = produtos [id, nome, unidade, preço], c = clientes [id, nome, bairro], r = bairros [nome].
// Sem listas, os campos ficam livres.
let PRODUTOS = [], CLIENTES = [], BAIRROS = [];
async function carregarListas() {
  try {
    const b = (new URLSearchParams(location.hash.slice(1)).get("z") || "").replace(/-/g, "+").replace(/_/g, "/");
    if (!b) return;
    const bytes = Uint8Array.from(atob(b + "=".repeat((4 - b.length % 4) % 4)), c => c.charCodeAt(0));
    const fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const d = JSON.parse(await new Response(fluxo).text());
    PRODUTOS = d.p || []; CLIENTES = d.c || []; BAIRROS = d.r || [];
  } catch (e) { /* sem listas: campos livres */ }
}

carregarListas().then(montar);
function montar() {
const OUTRO = "__outro";

const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const br = iso => iso ? iso.split("-").reverse().join("/") : "";
const reais = n => "R$ " + n.toFixed(2).replace(".", ",");
const num = v => { const n = parseFloat(String(v || "").replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const val = id => ($("#" + id)?.value || "").trim();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sem = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const CAMPO = (id, rotulo, tipoInput = "text", extra = "") =>
  `<label for="${id}">${rotulo}</label><input id="${id}" type="${tipoInput}" ${extra}>`;

// Horários de 30 em 30 min, 08:00–20:00 (05/11): lista, sem digitar símbolo.
const HORAS = [];
for (let m = 8 * 60; m <= 20 * 60; m += 30) HORAS.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
const LISTA_HORA = (id, rotulo, vazio = "— (sem horário)") =>
  `<label for="${id}">${rotulo}</label><select id="${id}"><option value="">${vazio}</option>${HORAS.map(h => `<option>${h}</option>`).join("")}</select>`;
const HORA_COBRANCA = LISTA_HORA("cobranca_hora", "Horário da cobrança");
const linhaHoraCobranca = () => val("cobranca_hora") ? [`Horário de cobrança: ${val("cobranca_hora")}`] : [];

// ---------- cliente já cadastrado: busca por nome ----------
let clienteEscolhido = null;
const BUSCA_CLIENTE = `<label for="busca">Cliente</label><div id="caixa-cliente">
  <input id="busca" placeholder="${CLIENTES.length ? "Cliente… (toque ou digite)" : "Nome do cliente"}"><div class="achados" id="achados"></div></div>`;

function ligarBusca() {
  const busca = $("#busca"), achados = $("#achados");
  if (!busca || !CLIENTES.length) return;
  // 07/11 (Wellington): tocou no campo → abre a lista inteira (A–Z, rola para achar);
  // digitando, filtra (quem começa com o texto vem primeiro).
  const mostrar = () => {
    const t = sem(busca.value.trim());
    const lista = CLIENTES.filter(c => !t || sem(c[1]).includes(t))
      .sort((a, b) => (t ? sem(b[1]).startsWith(t) - sem(a[1]).startsWith(t) : 0) || sem(a[1]).localeCompare(sem(b[1])));
    achados.innerHTML = lista
      .map(c => `<button type="button" data-id="${esc(c[0])}">${esc(c[1])} <small>${esc(c[2] || "sem bairro")}</small></button>`).join("")
      || `<button type="button" disabled><small>Ninguém com esse nome</small></button>`;
    achados.querySelectorAll("[data-id]").forEach(b => b.onclick = () => escolherCliente(CLIENTES.find(c => c[0] === b.dataset.id)));
  };
  busca.oninput = busca.onfocus = busca.onclick = mostrar;
  document.addEventListener("click", e => { if (e.target.isConnected && $("#caixa-cliente") && !$("#caixa-cliente").contains(e.target)) achados.innerHTML = ""; });
}
function escolherCliente(c) {
  clienteEscolhido = c;
  $("#caixa-cliente").innerHTML = `<div class="escolhido"><span>${esc(c[1])} <small>${esc(c[2] || "sem bairro")}</small></span>
    <button type="button" aria-label="Trocar">×</button></div>`;
  $("#caixa-cliente button").onclick = () => {
    clienteEscolhido = null;
    $("#caixa-cliente").innerHTML = `<input id="busca" placeholder="Cliente… (toque ou digite)"><div class="achados" id="achados"></div>`;
    ligarBusca(); $("#busca").focus();
  };
}
const nomeCliente = () => clienteEscolhido ? `${clienteEscolhido[1]} (${clienteEscolhido[0]})` : val("busca");

// ---------- cadastro de cliente novo ----------
const opsBairro = BAIRROS.map(b => `<option>${esc(b)}</option>`).join("");
const CADASTRO = `
  ${CAMPO("c_nome", "Nome *")}
  ${CAMPO("c_cel", "Celular", "tel")}
  <label for="c_bairro">Bairro</label>
  <select id="c_bairro"><option value="">—</option>${opsBairro}<option value="${OUTRO}">Outros (escrever)</option></select>
  <input id="c_bairro_novo" class="oculto" placeholder="Nome do bairro novo" style="margin-top:8px">
  ${CAMPO("c_end", "Endereço")}
  ${CAMPO("c_ref", "Referência (ponto conhecido perto)")}
  ${CAMPO("c_cep", "CEP", "text", 'inputmode="numeric"')}
  <div class="dupla"><div>${LISTA_HORA("c_hora_de", "Melhor horário: das", "—")}</div>
    <div>${LISTA_HORA("c_hora_ate", "às", "—")}</div></div>
  ${CAMPO("c_email", "E-mail", "email")}`;

function ligarCadastro() {
  const sel = $("#c_bairro");
  if (!sel) return;
  if (!BAIRROS.length) { sel.value = OUTRO; sel.classList.add("oculto"); $("#c_bairro_novo").classList.remove("oculto"); return; }
  sel.onchange = () => $("#c_bairro_novo").classList.toggle("oculto", sel.value !== OUTRO);
}
function bairroTexto() {
  const sel = val("c_bairro");
  if (sel === OUTRO) return val("c_bairro_novo") ? `${val("c_bairro_novo")} (novo)` : "";
  return sel;
}
// Melhor horário: "das 08:00 às 12:00" (só um lado preenchido também vale).
function melhorHorario() {
  const de = val("c_hora_de"), ate = val("c_hora_ate");
  return [de && `das ${de}`, ate && `às ${ate}`].filter(Boolean).join(" ");
}
const linhasCadastro = () => [`Nome: ${val("c_nome")}`, `Celular: ${val("c_cel")}`, `Bairro: ${bairroTexto()}`,
  `Endereço: ${val("c_end")}`, `Referência: ${val("c_ref")}`, `CEP: ${val("c_cep")}`,
  `Melhor horário: ${melhorHorario()}`, `E-mail: ${val("c_email")}`];

// ---------- produtos ----------
function campoProduto() {
  if (!PRODUTOS.length) return `<input placeholder="Produto" data-k="nome">`;
  // Lista própria (06/11): a lista nativa (<select>) não abre no Telegram do computador.
  // Igual no celular e no PC: toca → abre a lista inteira; digitando, filtra.
  return `<div class="pp"><input data-k="busca" placeholder="Produto… (toque ou digite)"><input type="hidden" data-k="sel"></div>`;
}
const rotuloProduto = p => p[1] + (p[2] ? ` (${p[2]})` : "");

function ligarProduto(div) {
  const pp = div.querySelector(".pp");
  if (!pp) return;
  const busca = pp.querySelector("[data-k=busca]"), sel = pp.querySelector("[data-k=sel]");
  const lista = document.createElement("div");
  lista.className = "achados"; pp.appendChild(lista);
  const fechar = () => { lista.innerHTML = ""; };
  const mostrar = () => {
    const t = sem(busca.value.trim());
    const itens = PRODUTOS.map((p, i) => [p, i]).filter(([p]) => !t || sem(p[1]).includes(t))
      .sort((a, b) => t ? sem(b[0][1]).startsWith(t) - sem(a[0][1]).startsWith(t) : 0);
    lista.innerHTML = `<button type="button" data-i="${OUTRO}">✏️ Outro (não está na lista)</button>`
      + itens.map(([p, i]) => `<button type="button" data-i="${i}">${esc(p[1])}${p[2] ? ` <small>${esc(p[2])}</small>` : ""}</button>`).join("");
    lista.querySelectorAll("[data-i]").forEach(b => b.onclick = () => escolher(b.dataset.i));
  };
  const escolher = i => {
    fechar();
    if (i === OUTRO) {   // troca a lista por campo livre nesta linha
      const inp = document.createElement("input");
      inp.placeholder = "Nome do produto"; inp.dataset.k = "nome"; inp.dataset.novo = "1"; inp.oninput = somar;
      pp.replaceWith(inp); inp.focus(); return;
    }
    const p = PRODUTOS[i], preco = div.querySelector("[data-k=preco]");
    sel.value = i; busca.value = rotuloProduto(p);
    if (preco) { preco.value = String(p[3]).replace(".", ","); const q = div.querySelector("[data-k=qtd]"); if (!q.value) q.value = "1"; }
    somar(); busca.blur();
  };
  busca.onfocus = busca.onclick = mostrar;
  busca.oninput = () => { sel.value = ""; mostrar(); somar(); };
  document.addEventListener("click", e => { if (!pp.contains(e.target)) fechar(); });
}
const comQtd = () => tipo !== "divida";

function linhaProduto() {
  const div = document.createElement("div");
  if (comQtd()) {
    div.className = "linha venda";
    div.innerHTML = `${campoProduto()}<input placeholder="Qtd" inputmode="decimal" data-k="qtd">
      <input placeholder="Preço" inputmode="decimal" data-k="preco"><button type="button" class="tirar" aria-label="Tirar">×</button>`;
  } else {
    div.className = "linha talao";
    div.innerHTML = `${campoProduto()}<input placeholder="Valor R$" inputmode="decimal" data-k="valor">
      <button type="button" class="tirar" aria-label="Tirar">×</button>`;
  }
  div.querySelector(".tirar").onclick = () => { div.remove(); somar(); };
  div.querySelectorAll("input").forEach(i => i.oninput = somar);
  ligarProduto(div);
  $("#produtos").appendChild(div);
}

function produtos() {
  return [...document.querySelectorAll("#produtos .linha")].map(l => {
    const g = k => (l.querySelector(`[data-k=${k}]`)?.value || "").trim();
    // Digitou e não tocou na lista: aceita se o texto bate com 1 produto só (06/11).
    let p = PRODUTOS[g("sel")];
    const t = sem(g("busca"));
    if (!p && t) {
      const ach = PRODUTOS.filter(x => sem(x[1]) === t || sem(rotuloProduto(x)) === t);
      const parc = ach.length ? ach : PRODUTOS.filter(x => sem(x[1]).includes(t));
      if (parc.length === 1) p = parc[0];
    }
    const novo = !p && g("nome") && (PRODUTOS.length || l.querySelector("[data-novo]"));
    return { nome: p ? `${p[1]} (${p[0]})` : g("nome") + (novo ? " (produto novo)" : ""), qtd: g("qtd") || (p && comQtd() ? "1" : ""), preco: g("preco"), valor: g("valor"),
             tabela: p ? Number(p[3]) : 0, busca: p ? "" : g("busca") };
  }).filter(p => p.nome || p.busca || p.qtd || p.preco || p.valor);
}

const totalVenda = () => produtos().reduce((s, p) => s + (comQtd() ? num(p.qtd || 1) * num(p.preco) : num(p.valor)), 0);
function somar() {
  const t = totalVenda();
  $("#total").textContent = t > 0 ? "Total: " + reais(t) : "";   // 07/11: caixa testada e recusada, voltou o texto simples
  pagamento();
}

// Venda nova (07/11, Wellington): sem valor pago = cobrança agendada → data obrigatória (horário opcional).
// Pagou tudo → some a cobrança. Pagou parte → data do restante obrigatória.
function pagamento() {
  if (tipo !== "venda" || !$("#pg_valor")) return;
  const t = Math.round(totalVenda() * 100) / 100, pg = num(val("pg_valor"));
  const quitou = pg > 0 && t > 0 && pg >= t - 0.005;
  $("#fs-cobranca").classList.toggle("oculto", quitou);
  $("label[for=cobranca]").textContent = pg > 0 && !quitou ? "Data de cobrança do restante *" : "Data de cobrança *";
  const d = $("#pg_dica"), excesso = pg > t + 0.005;
  d.className = "dica" + (!pg ? "" : excesso ? " excesso" : quitou ? " caixa quitada" : " deve");
  d.innerHTML = !pg ? "Não pagou agora? Deixe em branco e marque a data da cobrança."
    : excesso ? "Pago maior que o total da venda."
    : quitou ? "<span>✅ Venda quitada</span><span>sem cobrança</span>"
    : `Falta <b>${reais(t - pg)}</b>: marque a data da cobrança do restante.`;
}

// Preço diferente da tabela = desconto/combinado: o texto avisa para o bot não trocar pelo de tabela.
const linhasVenda = () => produtos().map(p => {
  const preco = p.preco ? num(p.preco) : 0;
  const extra = !p.preco ? " (preço de tabela)"
    : p.tabela && Math.abs(preco - p.tabela) > 0.004 ? ` (preço combinado; tabela ${reais(p.tabela)})` : "";
  return `${p.qtd || "?"}x ${p.nome || "?"}${p.preco ? " " + reais(preco) : ""}${extra}`;
});

const PRODUTOS_HTML = (titulo) => `<fieldset><legend>${titulo}</legend><div id="produtos"></div>
  <button type="button" class="add" id="add">+ produto</button><div class="total" id="total"></div></fieldset>`;
const OBS = `<label for="obs">Observação</label><textarea id="obs"></textarea>`;
const obsLinha = () => val("obs") ? ["", `Obs: ${val("obs")}`] : [];

// ---------- os 3 formulários ----------
let modoCliente = "cadastrado";   // débitos anteriores: "cadastrado" ou "novo"

if (tipo === "venda") {
  $("#titulo").textContent = "🛒 Venda nova";
  form.innerHTML = `
    <fieldset><legend>Cliente</legend>${BUSCA_CLIENTE}
      ${CAMPO("data", "Data da venda", "date", `value="${hojeISO()}"`)}</fieldset>
    ${PRODUTOS_HTML("Produtos")}
    <fieldset><legend>Pagamento</legend>
      <div class="dupla"><div>${CAMPO("pg_valor", "Pago agora R$", "text", 'inputmode="decimal" placeholder="0,00"')}</div>
        <div><label for="pg_forma">Forma</label><select id="pg_forma"><option value="">—</option><option>dinheiro</option><option>pix</option><option>cartão</option></select></div></div>
      <div class="dica" id="pg_dica">Não pagou agora? Deixe em branco e marque a data da cobrança.</div></fieldset>
    <fieldset id="fs-cobranca"><legend>Cobrança</legend>
      ${CAMPO("cobranca", "Data de cobrança *", "date")}${HORA_COBRANCA}</fieldset>
    <fieldset>${OBS}</fieldset>`;
} else if (tipo === "cliente") {
  $("#titulo").textContent = "👤 Cliente novo";
  form.innerHTML = `
    <fieldset><legend>Cadastro</legend>${CADASTRO}${OBS}</fieldset>
    ${PRODUTOS_HTML("Primeira compra (se tiver)")}
    <fieldset><legend>Cobrança</legend>${CAMPO("cobranca", "Data de cobrança (se já combinou)", "date")}${HORA_COBRANCA}</fieldset>`;
} else {
  $("#titulo").textContent = "📒 Débito anterior (talão)";
  form.innerHTML = `
    <div class="abas"><button type="button" data-m="cadastrado" class="on">Já cadastrado</button>
      <button type="button" data-m="novo">Cadastrar agora</button></div>
    <fieldset><legend>Cliente</legend>
      <div id="m-cadastrado">${BUSCA_CLIENTE}</div><div id="m-novo" class="oculto">${CADASTRO}</div></fieldset>
    <fieldset><legend>Talão</legend>${CAMPO("data", "Data de saída", "date")}</fieldset>
    ${PRODUTOS_HTML("Produtos")}
    <fieldset><legend>Débito anterior</legend>
      <div class="dupla"><div>${CAMPO("ant_valor", "Valor R$", "text", 'inputmode="decimal"')}</div>
        <div>${CAMPO("ant_data", "Data", "date")}</div></div></fieldset>
    <fieldset><legend>Recebimento (se já pagou algo)</legend>
      <div class="dupla"><div>${CAMPO("rec_data", "Data", "date")}</div>
        <div>${CAMPO("rec_valor", "Recebeu R$", "text", 'inputmode="decimal"')}</div></div>
      <label for="rec_forma">Forma de pagamento</label>
      <select id="rec_forma"><option value="informar">informar</option><option>dinheiro</option><option>pix</option><option>cartão</option></select>
    </fieldset>
    <fieldset><legend>Cobrança</legend>${CAMPO("cobranca", "Data de cobrança do restante", "date")}${HORA_COBRANCA}${OBS}</fieldset>`;
  document.querySelectorAll(".abas button").forEach(b => b.onclick = () => {
    modoCliente = b.dataset.m;
    document.querySelectorAll(".abas button").forEach(x => x.classList.toggle("on", x === b));
    $("#m-cadastrado").classList.toggle("oculto", modoCliente !== "cadastrado");
    $("#m-novo").classList.toggle("oculto", modoCliente !== "novo");
  });
}
$("#add").onclick = linhaProduto;
if ($("#pg_valor")) $("#pg_valor").oninput = pagamento;
linhaProduto();   // linha vazia é ignorada no envio (primeira compra do cliente novo é opcional)
ligarBusca(); ligarCadastro();

// ---------- texto enviado ao bot ----------
function montarTexto() {
  if (tipo === "venda") {
    const t = totalVenda(), pg = num(val("pg_valor"));
    const quitou = pg > 0 && pg >= t - 0.005;
    const pago = pg > 0 ? [`Pago na hora: ${reais(pg)} (${val("pg_forma")})`] : ["Pago na hora: não"];
    const cob = quitou ? ["Cobrança: não tem (venda quitada)"]
      : [`${pg > 0 ? `Restante ${reais(t - pg)} · data` : "Data"} de cobrança: ${br(val("cobranca"))}`, ...linhaHoraCobranca()];
    return ["🛒 FORMULÁRIO VENDA NOVA", "", `Cliente: ${nomeCliente()}`, `Data da venda: ${br(val("data"))}`,
      "Produtos (quantidade e preço):", ...linhasVenda(), `Total: ${reais(t)}`, "", ...pago, ...cob, ...obsLinha()].join("\n");
  }
  if (tipo === "cliente") {
    const compra = linhasVenda();
    return ["👤 FORMULÁRIO CLIENTE NOVO", "", ...linhasCadastro(), ...obsLinha(),
      ...(compra.length ? ["", "Primeira compra (quantidade e preço):", ...compra, "", `Data de cobrança: ${br(val("cobranca"))}`, ...linhaHoraCobranca()] : [])].join("\n");
  }
  const linhas = produtos().map(p => `${p.nome || "?"}: ${p.valor ? reais(num(p.valor)) : "R$"}`);
  const ant = val("ant_valor") ? reais(num(val("ant_valor"))) : "R$";
  const rec = val("rec_valor") ? reais(num(val("rec_valor"))) : "R$";
  const cli = modoCliente === "novo" ? ["CLIENTE NOVO (cadastrar antes)", ...linhasCadastro()] : [`Cliente: ${nomeCliente()}`];
  return ["📒 FORMULÁRIO DÉBITOS ANTERIORES", "", ...cli, "", "COBRANÇA", "",
    `Data de saida: ${br(val("data")) || "//"}`, "Produtos:", ...linhas, "",
    `Débito anterior: ${ant} data: ${br(val("ant_data")) || "//"}`, "",
    "Data recebimento:", `data: ${br(val("rec_data")) || "//"} recebeu: ${rec} forma de pagamento: ${val("rec_forma")} falta: R$`, "",
    `Data de cobrança: ${br(val("cobranca"))}`, ...linhaHoraCobranca(), ...obsLinha()].join("\n");
}

function conferir() {
  const ps = produtos();
  if (tipo === "venda") {
    if (!nomeCliente()) return "Escolha o cliente.";
    if (ps.some(p => !p.nome && p.busca)) return "Toque no produto na lista (ou em ✏️ Outro).";
    if (!ps.some(p => p.nome)) return "Coloque pelo menos um produto.";
    const t = totalVenda(), pg = num(val("pg_valor"));
    if (val("pg_valor") && pg <= 0) return "Valor pago inválido.";
    if (pg > t + 0.005) return "Pago maior que o total da venda.";
    if (pg > 0 && !val("pg_forma")) return "Escolha a forma do pagamento.";
    if (!pg && val("pg_forma")) return "Coloque o valor pago (ou tire a forma).";
    if (!(pg > 0 && pg >= t - 0.005) && !val("cobranca"))
      return pg > 0 ? "Falta a data da cobrança do restante." : "Sem pagamento agora: falta a data da cobrança.";
  } else if (tipo === "cliente") {
    if (!val("c_nome")) return "Falta o nome do cliente.";
  } else {
    if (modoCliente === "novo" ? !val("c_nome") : !nomeCliente()) return "Falta o cliente.";
    if (ps.some(p => !p.nome && p.busca)) return "Toque no produto na lista (ou em ✏️ Outro).";
    if (!(ps.some(p => num(p.valor) > 0) || num(val("ant_valor")) > 0)) return "Coloque algum valor (produto ou débito anterior).";
  }
  return "";
}

$("#enviar").onclick = () => {
  const erro = conferir();
  $("#aviso").textContent = erro;
  if (erro) return;
  const texto = montarTexto();
  // Aberto pelo botão do teclado o initData vem vazio; dentro do Telegram a plataforma não é "unknown".
  if (tg && tg.platform && tg.platform !== "unknown") { tg.sendData(texto); return; }   // fecha a janela e manda ao bot
  $("#saida").hidden = false; $("#saida").textContent = texto;  // fora do Telegram: só mostra
};

if (tg) { tg.ready(); tg.expand(); }
}
</script>
